  );};

  // === MANAGE ===
  const Manage=()=>{
    const[search,setSearch]=useState('');
    const filtered=yearEntries.filter(e=>{
      if(!search)return true;
      const s=search.toLowerCase();
      return e.name.toLowerCase().includes(s)||e.category.toLowerCase().includes(s)||(e.dept||'').toLowerCase().includes(s);
    }).sort((a,b)=>b.date.localeCompare(a.date));

    return(
      <div style={{padding:'16px',maxWidth:'600px',margin:'0 auto'}}>
        {/* Entry Form */}
        <div style={{background:'#fff',borderRadius:'16px',padding:'16px',marginBottom:'16px',border:'1px solid #e5e7eb',boxShadow:'0 2px 8px rgba(0,0,0,.05)'}}>
          <h3 style={{fontSize:'14px',fontWeight:700,marginBottom:'12px'}}>{editId?'✏️ 수정':'➕ 포인트 입력'}</h3>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}}>
            <input value={formName} onChange={e=>setFormName(e.target.value)} placeholder="이름 *" style={{padding:'8px 12px',border:'1px solid #ddd',borderRadius:'8px',fontSize:'13px'}}/>
            <select value={formDept} onChange={e=>setFormDept(e.target.value)} style={{padding:'8px 12px',border:'1px solid #ddd',borderRadius:'8px',fontSize:'13px',color:formDept?'#333':'#999'}}>
              <option value="">부서</option>
              {departments.map(d=>(<option key={d} value={d}>{d}</option>))}
            </select>
            <select value={formCat} onChange={e=>setFormCat(e.target.value)} style={{padding:'8px 12px',border:'1px solid #ddd',borderRadius:'8px',fontSize:'13px',color:formCat?'#333':'#999'}}>
              <option value="">카테고리 *</option>
              {categories.map(c=>(<option key={c} value={c}>{c}</option>))}
            </select>
            <input type="number" value={formScore} onChange={e=>setFormScore(e.target.value)} placeholder="점수 *" style={{padding:'8px 12px',border:'1px solid #ddd',borderRadius:'8px',fontSize:'13px'}}/>
            <input type="date" value={formDate} onChange={e=>setFormDate(e.target.value)} style={{padding:'8px 12px',border:'1px solid #ddd',borderRadius:'8px',fontSize:'13px'}}/>
            <input value={formMemo} onChange={e=>setFormMemo(e.target.value)} placeholder="메모" style={{padding:'8px 12px',border:'1px solid #ddd',borderRadius:'8px',fontSize:'13px'}}/>
          </div>
          <div style={{display:'flex',gap:'8px',marginTop:'10px'}}>
            <button onClick={addEntry} style={{flex:1,padding:'10px',background:editId?'#f59e0b':'#2563eb',color:'#fff',border:'none',borderRadius:'8px',fontWeight:700,fontSize:'13px',cursor:'pointer'}}>{editId?'수정 완료':'등록'}</button>
            {editId&&<button onClick={()=>{setEditId(null);setFormName('');setFormScore('');setFormMemo('')}} style={{padding:'10px 16px',background:'#e5e7eb',color:'#333',border:'none',borderRadius:'8px',fontWeight:600,fontSize:'13px',cursor:'pointer'}}>취소</button>}
          </div>
        </div>

        {/* Excel Import */}
        <div style={{display:'flex',gap:'8px',marginBottom:'16px'}}>
          <label style={{flex:1,padding:'10px',background:'#fff',border:'1px dashed #10b981',borderRadius:'8px',textAlign:'center',cursor:'pointer',fontSize:'12px',fontWeight:600,color:'#10b981'}}>
            📥 엑셀 가져오기 (이름/부서/카테고리/점수/날짜)
            <input type="file" accept=".xlsx,.xls,.csv" onChange={handleExcel} style={{display:'none'}}/>
          </label>
        </div>

        {/* List */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'8px'}}>
          <span style={{fontSize:'13px',fontWeight:600,color:'#666'}}>{year}년 총 <span style={{color:'#2563eb',fontWeight:800}}>{filtered.length}</span>건</span>
          <div style={{position:'relative'}}>
            <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="검색..." style={{padding:'6px 10px 6px 28px',border:'1px solid #ddd',borderRadius:'8px',fontSize:'12px',width:'140px'}}/>
            <Icon name="Search" size={14} style={{position:'absolute',left:'8px',top:'50%',transform:'translateY(-50%)',color:'#999'}}/>
          </div>
        </div>

        {filtered.length===0?(
          <div style={{textAlign:'center',padding:'40px',color:'#999',fontSize:'13px'}}>데이터 없음</div>
        ):(
          <div style={{display:'flex',flexDirection:'column',gap:'6px'}}>
            {filtered.map(e=>{
              const ci=categories.indexOf(e.category);
              return(
                <div key={e.id} style={{background:'#fff',borderRadius:'12px',padding:'10px 14px',border:'1px solid #e5e7eb',display:'flex',alignItems:'center',gap:'10px'}}>
                  <div style={{width:'4px',height:'36px',borderRadius:'4px',background:ci>=0?getCatColor(ci):'#ddd',flexShrink:0}}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:'flex',alignItems:'center',gap:'6px',marginBottom:'2px'}}>
                      <span style={{fontSize:'13px',fontWeight:700}}>{e.name}</span>
                      {e.dept&&<span style={{fontSize:'10px',color:'#999'}}>{e.dept}</span>}
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:'6px'}}>
                      <span style={{fontSize:'10px',fontWeight:600,padding:'1px 6px',borderRadius:'4px',background:ci>=0?getCatColor(ci)+'20':'#f3f4f6',color:ci>=0?getCatColor(ci):'#666'}}>{e.category}</span>
                      <span style={{fontSize:'10px',color:'#999'}}>{e.date}</span>
                      {e.memo&&<span style={{fontSize:'10px',color:'#bbb'}}>· {e.memo}</span>}
                    </div>
                  </div>
                  <div style={{fontSize:'16px',fontWeight:800,color:'#333',flexShrink:0}}>{e.score}</div>
                  <div style={{display:'flex',gap:'4px',flexShrink:0}}>
                    <button onClick={()=>editEntry(e)} style={{background:'none',border:'none',cursor:'pointer',color:'#999',padding:'4px'}}><Icon name="Pencil" size={14}/></button>
                    <button onClick={()=>delEntry(e.id)} style={{background:'none',border:'none',cursor:'pointer',color:'#ef4444',padding:'4px'}}><Icon name="Trash2" size={14}/></button>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {/* Product Management */}
        <div style={{marginTop:'24px',background:'#fff',borderRadius:'16px',padding:'16px',border:'1px solid #e5e7eb',boxShadow:'0 2px 8px rgba(0,0,0,.05)'}}>
          <h3 style={{fontSize:'14px',fontWeight:700,marginBottom:'12px'}}>🎁 교환 상품 등록</h3>
          <ProductManager products={products} setProducts={setProducts}/>
        </div>

        {/* Exchange Requests & History */}
        {(()=>{
          const yearEx=exchangeHistory.filter(h=>{const m=(h.date||'').match(/(\d{4})/);return m&&parseInt(m[1])===year});
          const pending=yearEx.filter(h=>h.status!=='완료').sort((a,b)=>b.date.localeCompare(a.date));
          const completed=yearEx.filter(h=>h.status==='완료').sort((a,b)=>b.date.localeCompare(a.date));
          return(<>
          {/* 교환 신청 내역 */}
          {pending.length>0&&(
          <div style={{marginTop:'16px',background:'#fff',borderRadius:'16px',padding:'16px',border:'2px solid #fbbf24',boxShadow:'0 2px 8px rgba(245,158,11,.1)'}}>
            <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'12px'}}>
              <span style={{fontSize:'16px'}}>📋</span>
              <h3 style={{fontSize:'14px',fontWeight:700,margin:0,color:'#92400e'}}>교환 신청 내역</h3>
              <span style={{background:'#fef3c7',color:'#92400e',fontSize:'11px',fontWeight:700,padding:'2px 8px',borderRadius:'10px'}}>{pending.length}건 대기중</span>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:'8px'}}>
              {pending.map(h=>(
                <div key={h.id} style={{display:'flex',alignItems:'center',gap:'8px',padding:'10px 12px',background:'#fffbeb',borderRadius:'10px',border:'1px solid #fde68a',fontSize:'12px'}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:'flex',alignItems:'center',gap:'6px',marginBottom:'3px'}}>
                      <span style={{fontWeight:700,fontSize:'13px'}}>{h.name}</span>
                      <span style={{color:'#888',fontSize:'11px'}}>{h.dept}</span>
                    </div>
                    <div style={{display:'flex',alignItems:'center',gap:'6px'}}>
                      <span style={{color:'#f59e0b',fontWeight:700}}>🎁 {h.product}</span>
                      <span style={{fontWeight:800,color:'#b45309'}}>{h.points}P</span>
                      <span style={{color:'#bbb',fontSize:'10px'}}>{h.date}</span>
                    </div>
                  </div>
                  <button onClick={()=>approveExchange(h)} style={{padding:'6px 12px',background:'linear-gradient(135deg,#22c55e,#16a34a)',color:'#fff',border:'none',borderRadius:'8px',fontSize:'11px',fontWeight:700,cursor:'pointer',whiteSpace:'nowrap',boxShadow:'0 2px 6px rgba(34,197,94,.3)'}}>✅ 지급완료</button>
                  <button onClick={()=>cancelExchange(h)} style={{padding:'6px 8px',background:'#f3f4f6',color:'#999',border:'none',borderRadius:'8px',fontSize:'11px',cursor:'pointer'}} title="취소">✕</button>
                </div>
              ))}
            </div>
          </div>
          )}

          {/* 교환 완료 내역 */}
          {completed.length>0&&(
          <div style={{marginTop:'16px',background:'#fff',borderRadius:'16px',padding:'16px',border:'1px solid #e5e7eb'}}>
            <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'12px'}}>
              <span style={{fontSize:'16px'}}>✅</span>
              <h3 style={{fontSize:'14px',fontWeight:700,margin:0}}>교환 완료 내역</h3>
              <span style={{background:'#f0fdf4',color:'#166534',fontSize:'11px',fontWeight:700,padding:'2px 8px',borderRadius:'10px'}}>{completed.length}건</span>
            </div>
            <div style={{display:'flex',flexDirection:'column',gap:'6px'}}>
              {completed.map(h=>(
                <div key={h.id} style={{display:'flex',alignItems:'center',gap:'10px',padding:'8px 10px',background:'#f9fafb',borderRadius:'8px',fontSize:'12px'}}>

                  <span style={{color:'#888'}}>{h.dept}</span>
                  <span style={{flex:1,color:'#f59e0b',fontWeight:600}}>{h.product}</span>
                  <span style={{fontWeight:700,color:'#64748b'}}>-{h.points}P</span>
                  <span style={{color:'#bbb'}}>{h.date}</span>
                  <span style={{background:'#dcfce7',color:'#166534',padding:'2px 6px',borderRadius:'4px',fontSize:'10px',fontWeight:600}}>완료</span>
                </div>
              ))}
            </div>
          </div>
          )}
          </>);
        })()}
      </div>
    );
  };

  const grd='linear-gradient(135deg,#f59e0b,#f97316)';
  const acc='#f59e0b';
  const tabs=[{id:'dashboard',label:'대시보드',icon:'BarChart3'},{id:'manage',label:'관리',icon:'PlusCircle'},{id:'list',label:'전체목록',icon:'List'}];

  // === ALL LIST (grouped by person) ===
  const AllList=()=>(
    <div style={{padding:'16px',maxWidth:'600px',margin:'0 auto'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'12px'}}>
        <h3 style={{fontSize:'15px',fontWeight:700,margin:0}}>📋 개인별 상세</h3>
        <select value={year} onChange={e=>setYear(Number(e.target.value))} style={{padding:'4px 10px',borderRadius:'6px',border:'1px solid #ddd',fontSize:'12px'}}>{[2026,2027,2028].map(y=>(<option key={y} value={y}>{y}년</option>))}</select>
      </div>
      {rankings.length===0?(
        <div style={{textAlign:'center',padding:'40px',color:'#999',fontSize:'13px'}}>데이터 없음</div>
      ):(
        <div style={{display:'flex',flexDirection:'column',gap:'8px'}}>
          {rankings.map((p,idx)=>(
            <details key={p.name+idx} style={{background:'#fff',borderRadius:'12px',border:'1px solid #e5e7eb',overflow:'hidden'}}>
              <summary style={{padding:'10px 14px',cursor:'pointer',display:'flex',alignItems:'center',gap:'10px',listStyle:'none'}}>
                <span style={{fontSize:'12px',fontWeight:800,color:idx<3?['#FFD700','#C0C0C0','#CD7F32'][idx]:'#888',width:'20px'}}>{idx+1}</span>
                <span style={{fontSize:'13px',fontWeight:700,flex:1}}>{p.name} <span style={{fontSize:'10px',color:'#999',fontWeight:400}}>{p.dept}</span></span>
                <div style={{display:'flex',gap:'4px'}}>
                  {categories.map((cat,ci)=>{const v=p.totals[cat];if(!v)return null;return(
                    <span key={cat} style={{fontSize:'9px',fontWeight:700,padding:'2px 6px',borderRadius:'4px',background:getCatColor(ci)+'20',color:getCatColor(ci)}}>{cat} {v}</span>
                  )})}
                </div>
                <span style={{fontSize:'14px',fontWeight:800,color:'#333',whiteSpace:'nowrap'}}>{p.gross}{p.exchange>0&&<span style={{fontSize:'11px',color:'#888',fontWeight:600}}>({p.total})</span>}</span>
              </summary>
              <div style={{padding:'8px 14px 12px',borderTop:'1px solid #f3f4f6',background:'#fafafa'}}>
                {yearEntries.filter(e=>e.name===p.name).sort((a,b)=>b.date.localeCompare(a.date)).map(e=>{
                  const ci=categories.indexOf(e.category);
                  return(
                    <div key={e.id} style={{display:'flex',alignItems:'center',gap:'8px',padding:'4px 0',fontSize:'11px'}}>
                      <span style={{width:'4px',height:'16px',borderRadius:'2px',background:ci>=0?getCatColor(ci):'#ddd'}}/>
                      <span style={{color:'#999',width:'70px'}}>{e.date}</span>
                      <span style={{fontWeight:600,color:ci>=0?getCatColor(ci):'#666'}}>{e.category}</span>
                      <span style={{flex:1,color:'#999'}}>{e.memo||''}</span>
                      <span style={{fontWeight:800}}>{e.score}</span>
                    </div>
                  );
                })}
              </div>
            </details>
          ))}
        </div>
      )}
    </div>
  );

  return(<div style={{display:'flex',flexDirection:'column',height:'100vh',background:'#f0f4ff'}}>
    {/* Header */}
    <div style={{flexShrink:0,background:grd,padding:'10px 16px',display:'flex',alignItems:'center',gap:'10px'}}>
      <button onClick={onBack} style={{background:'rgba(255,255,255,.15)',border:'none',cursor:'pointer',color:'#fff',borderRadius:'10px',width:'34px',height:'34px',display:'flex',alignItems:'center',justifyContent:'center'}}><Icon name="ArrowLeft" size={20}/></button>
      <span style={{fontSize:'24px'}}>🎯</span>
      <h1 style={{color:'#fff',fontSize:'15px',fontWeight:800,margin:0,flex:1}}>CI Point</h1>
      <button onClick={()=>{if(!isAdmin){const pw=prompt('관리자 비밀번호:');if(pw===ADMIN_PW)setIsAdmin(true);else{alert('비밀번호 오류');return;}}setShowSettings(true)}} style={{background:'rgba(255,255,255,.15)',border:'none',cursor:'pointer',color:'#fff',borderRadius:'10px',width:'34px',height:'34px',display:'flex',alignItems:'center',justifyContent:'center'}}><Icon name="Settings" size={16}/></button>
    </div>

    {/* Content */}
    <div style={{flex:1,overflow:'auto',paddingBottom:'70px'}}>
      {activeTab==='dashboard'&&<Dashboard/>}
      {activeTab==='manage'&&<Manage/>}
      {activeTab==='list'&&<AllList/>}
    </div>

    {/* Bottom Tab Bar */}
    <nav style={{position:'fixed',bottom:0,left:0,right:0,background:'#fff',borderTop:'1px solid #e5e7eb',boxShadow:'0 -4px 20px rgba(0,0,0,.05)',zIndex:40}}>
      <div style={{maxWidth:'600px',margin:'0 auto',display:'flex'}}>
        {tabs.map(t=>(
          <button key={t.id} onClick={()=>{
            if((t.id==='manage'||t.id==='list')&&!isAdmin){
              const pw=prompt('관리자 비밀번호를 입력하세요:');
              if(pw!==ADMIN_PW){if(pw!==null)alert('비밀번호가 틀립니다.');return;}
              setIsAdmin(true);
            }
            setActiveTab(t.id);
          }} style={{flex:1,padding:'10px 0',display:'flex',flexDirection:'column',alignItems:'center',gap:'3px',border:'none',background:'transparent',cursor:'pointer',position:'relative'}}>
            {activeTab===t.id&&<div style={{position:'absolute',top:0,left:'20%',right:'20%',height:'3px',borderRadius:'0 0 3px 3px',background:grd}}/>}
            <Icon name={t.icon} size={20} style={{color:activeTab===t.id?acc:'#9ca3af'}}/>
            <span style={{fontSize:'11px',fontWeight:activeTab===t.id?700:500,color:activeTab===t.id?acc:'#9ca3af'}}>{t.label}</span>
          </button>
        ))}
      </div>
    </nav>

    {settingsModal}
  </div>);
}

const SP_GAS_URL = 'https://script.google.com/macros/s/AKfycbwDMTcTV_P1ga7yVd_2kFas1d-Y9xoDK0_fG18ZRdjXjaghTcMq3e_9PPgP1-GdBzIIkA/exec';
const spApi={
  async get(){if(!SP_GAS_URL)return null;try{const r=await fetch(SP_GAS_URL);return await r.json();}catch(e){console.error('SP get:',e);return null;}},
  async post(body){if(!SP_GAS_URL)return null;try{const r=await fetch(SP_GAS_URL,{method:'POST',body:JSON.stringify(body)});return await r.json();}catch(e){console.error('SP post:',e);return null;}}
};

  ]},
  {id:'warehouse',name:'창고',icon:'📦',color:'#f59e0b',questions:[
    {no:'1',text:'작업자는 PPE를 착용하고 있나요? (보안경-지게차 운행시 제외, 안전화)'},
    {no:'2',text:'작업 전 지게차 안전점검은 실시되었나요?\n(점검 완료 확인 방법 - 지게차 일일 설비 안전 점검 체크 시트 실시 이력 확인)'},
    {no:'3',text:'지게차에 설치된 Blue spot, Red Beam, 알람(전진, 후진)이 정상적으로 작동하나요?'},
    {no:'4',text:'지게차 외부에 찍힘, 스크레치 등 있나요?',sub:{no:'4-1',text:'지게차 찍힘, 스크레치에 대해 운전자 확인 후 안전 운전에 대한 Positive interruption 전달해주세요.\n(전달 내용 기록)',type:'text',trigger:'Y'}},
    {no:'5',text:'작업 시 사용하는 도구는 적합하며, 도구 사용 시 베임방지장갑을 착용하고 있나요?\n(안전칼, 안전가위 사용, 일반 칼 사용 중일 경우 팀장 승인 확인)',sub:{no:'5-1',text:'부적합 확인 시 작업자에게 안전한 작업에 대한 Positive interruption 전달해주세요.\n(전달 내용 기록)',type:'text',trigger:'N'}},
    {no:'6',text:'창고 내 바닥은 전선, 방해물(박스 등) 등에 걸려 넘어지거나, 누유, 미끄러져 넘어질 위험은 없나요?'},
    {no:'7',text:'화학물질을 사용하는 구역에는 MSDS 비치되어 있나요?'},
    {no:'8',text:'비상구/소화전 앞 적재물로 인한 간섭 없이 언제든지 접근 가능한가요?'},
    {no:'9',text:'[작업자 인터뷰-Positive feedback] 작업자의 안전을 위해 Positive feedback을 했나요?',sub:{no:'9-1',text:'Positive feedback을 하지 못한 이유는 무엇인가요?',type:'text',trigger:'N'}}
  ]},
  {id:'measure',name:'측정실',icon:'📏',color:'#ec4899',questions:[
    {no:'1',text:'작업자는 PPE를 착용하고 있나요? (보안경-화학물 취급시, 안전화)'},
    {no:'2',text:'측정실내/장비 주변 사고 위험요소가 있나요?',sub:{no:'2-1',text:'어떤 위험요소가 있는지 적어주세요.',type:'text',trigger:'Y'}},
    {no:'3',text:'측정 시 사용하는 도구는 적합한가요?\n(부적합: 날카롭거나, 사용하기 불편하여 작업자가 손으로 조치하고 있는 상태)'},
    {no:'4',text:'측정실 바닥은 전선, 방해물(박스 등) 등에 걸려 넘어지거나, 미끄러져 넘어질 위험은 없나요?'},
    {no:'5',text:'비상구/소화전 앞 적재물로 인한 간섭 없이 언제든지 접근 가능한가요?'},
    {no:'6',text:'화학물질 보관 및 사용 구역에는 MSDS 비치되어있고, 소분용기에 GHS 경고표지가 부착되어 있나요?'},

function SafetyPatrolApp({onBack}){
  const[tab,setTab]=useState('schedule');
  const[zone,setZone]=useState(null);
  const[inspector,setInspector]=useState('');
  const[patrolDate,setPatrolDate]=useState(kstToday());
  const[answers,setAnswers]=useState({});
  const[findings,setFindings]=useState('');
  const[patrols,setPatrols]=useState(()=>S.get('sp_patrols',[]));
  const[showSuccess,setShowSuccess]=useState(false);
  const[isAdmin,setIsAdmin]=useState(false);
  const ADMIN_PW='eaton12!@';
  const grd='linear-gradient(135deg,#0ea5e9,#06b6d4)';
  const acc='#0ea5e9';

  // 스케줄 & 점검자 목록
  const[inspectors,setInspectors]=useState(()=>S.get('sp_inspectors',[]));
  const[schedule,setSchedule]=useState(()=>S.get('sp_schedule',{})); // {yyyy-Www: {mon:[name],tue:[name],...}}
  const[scheduleWeek,setScheduleWeek]=useState(()=>{
    const d=new Date();const jan1=new Date(d.getFullYear(),0,1);const days=Math.floor((d-jan1)/86400000);
    return d.getFullYear()+'-W'+String(Math.ceil((days+jan1.getDay()+1)/7)).padStart(2,'0');
  });

  useEffect(()=>{S.set('sp_patrols',patrols)},[patrols]);
  useEffect(()=>{S.set('sp_inspectors',inspectors)},[inspectors]);
  useEffect(()=>{S.set('sp_schedule',schedule)},[schedule]);
  useEffect(()=>{
    if(!SP_GAS_URL)return;
    spApi.get().then(res=>{
      if(res&&res.success){
        if(res.patrols)setPatrols(res.patrols);
        if(res.inspectors)setInspectors(res.inspectors);
        if(res.schedule)setSchedule(res.schedule);
      }
    });
  },[]);

  const setAns=(no,field,val)=>setAnswers(prev=>({...prev,[no]:{...(prev[no]||{}), [field]:val}}));
  const getAns=(no)=>answers[no]||{};
  const resetForm=()=>{setZone(null);setAnswers({});setFindings('');setInspector('');setPatrolDate(kstToday());};

  const handleSubmit=()=>{
    if(!inspector.trim()){alert('점검자를 입력해주세요.');return;}
    const zoneData=SP_ZONES.find(z=>z.id===zone);
    const unanswered=zoneData.questions.filter(q=>!getAns(q.no).result);
    if(unanswered.length>0){alert(`${unanswered.length}개 항목이 미응답입니다.\n(${unanswered.map(q=>'Q'+q.no).join(', ')})`);return;}
    const newId=Date.now().toString();
    const patrol={id:newId,date:patrolDate,inspector:inspector.trim(),zone:zoneData.name,zoneId:zone,answers,findings,createdAt:new Date().toISOString()};
    setPatrols(prev=>[patrol,...prev]);
    spApi.post({action:'addPatrol',...patrol}).then(res=>{if(res&&res.id)setPatrols(prev=>prev.map(p=>p.id===newId?{...p,id:res.id}:p))});
    setShowSuccess(true);
    setTimeout(()=>{setShowSuccess(false);resetForm();setTab('schedule')},1500);
  };
  const delPatrol=(id)=>{if(confirm('삭제하시겠습니까?')){setPatrols(prev=>prev.filter(p=>p.id!==id));spApi.post({action:'deletePatrol',id})}};

  // ===== 주간 날짜 헬퍼 =====
  const getWeekDates=(weekStr)=>{
    // weekStr = "2026-W09"
    const[y,w]=weekStr.split('-W').map(Number);
    const jan4=new Date(y,0,4);
    const start=new Date(jan4);
    start.setDate(jan4.getDate()-jan4.getDay()+1+(w-1)*7); // Monday
    const dates=[];
    for(let i=0;i<5;i++){const d=new Date(start);d.setDate(start.getDate()+i);dates.push(d);}
    return dates;
  };
  const fmtDate=(d)=>d.toISOString().slice(0,10);
  const fmtShort=(d)=>`${d.getMonth()+1}/${d.getDate()}`;
  const DAYS=['월','화','수','목','금'];
  const DAY_KEYS=['mon','tue','wed','thu','fri'];

  const changeWeek=(delta)=>{
    const[y,w]=scheduleWeek.split('-W').map(Number);
    let nw=w+delta,ny=y;
    if(nw<1){ny--;nw=52;}
    if(nw>52){ny++;nw=1;}
    setScheduleWeek(ny+'-W'+String(nw).padStart(2,'0'));
  };

  const getWeekSchedule=()=>schedule[scheduleWeek]||{};
  const setDaySchedule=(dayKey,names)=>{
    const ws={...schedule};
    if(!ws[scheduleWeek])ws[scheduleWeek]={};
    ws[scheduleWeek][dayKey]=names;
    setSchedule(ws);
    spApi.post({action:'saveSchedule',schedule:ws});
  };

  // ===== 스케줄 탭 =====
  const ScheduleTab=()=>{
    const weekDates=getWeekDates(scheduleWeek);
    const ws=getWeekSchedule();
    const today=kstToday();
    const[editDay,setEditDay]=useState(null);
    const[editItems,setEditItems]=useState([]); // [{name,zoneId}]
    const[addName,setAddName]=useState('');
    const[addZone,setAddZone]=useState('');

    const startEdit=(dayKey)=>{
      if(!isAdmin){const pw=prompt('관리자 비밀번호를 입력하세요:');if(pw!==ADMIN_PW){if(pw!==null)alert('비밀번호가 틀립니다.');return;}setIsAdmin(true);}
      setEditDay(dayKey);
      setEditItems(ws[dayKey]||[]);
      setAddName('');setAddZone('');
    };
    const addItem=()=>{
      if(!addName||!addZone)return;
      setEditItems(prev=>[...prev,{name:addName,zoneId:addZone}]);
      setAddName('');setAddZone('');
    };
    const removeItem=(idx)=>setEditItems(prev=>prev.filter((_,i)=>i!==idx));
    const saveEdit=()=>{setDaySchedule(editDay,editItems);setEditDay(null);};

    // 스케줄 클릭 → 점검 시작
    const startFromSchedule=(dateStr,item)=>{
      setPatrolDate(dateStr);
      setInspector(item.name);
      setZone(item.zoneId);
      setAnswers({});
      setFindings('');
      setTab('check');
    };

    return(<div style={{padding:'16px',maxWidth:'500px',margin:'0 auto'}}>
      {/* Week nav */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:'12px',marginBottom:'16px'}}>
        <button onClick={()=>changeWeek(-1)} style={{background:'#f3f4f6',border:'none',cursor:'pointer',borderRadius:'8px',width:'32px',height:'32px',display:'flex',alignItems:'center',justifyContent:'center'}}><Icon name="ChevronLeft" size={16}/></button>
        <div style={{textAlign:'center'}}>
          <div style={{fontSize:'14px',fontWeight:800,color:'#333'}}>{scheduleWeek.replace('-W',' W')}</div>
          <div style={{fontSize:'11px',color:'#888'}}>{fmtShort(weekDates[0])} ~ {fmtShort(weekDates[4])}</div>
        </div>
        <button onClick={()=>changeWeek(1)} style={{background:'#f3f4f6',border:'none',cursor:'pointer',borderRadius:'8px',width:'32px',height:'32px',display:'flex',alignItems:'center',justifyContent:'center'}}><Icon name="ChevronRight" size={16}/></button>
      </div>

      {/* Weekly table */}
      <div style={{display:'flex',flexDirection:'column',gap:'6px'}}>
        {DAY_KEYS.map((dk,i)=>{
          const date=weekDates[i];
          const dateStr=fmtDate(date);
          const isToday=dateStr===today;
          const assigned=ws[dk]||[]; // [{name,zoneId}]
          const done=patrols.filter(p=>p.date===dateStr);

          return(<div key={dk} style={{background:isToday?'#f0f9ff':'#fff',borderRadius:'12px',border:isToday?'2px solid #0ea5e9':'1px solid #e5e7eb',padding:'12px',transition:'all .2s'}}>
            <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:assigned.length>0?'6px':'0'}}>
              {/* Day label */}
              <div style={{width:'36px',textAlign:'center',flexShrink:0}}>
                <div style={{fontSize:'11px',fontWeight:700,color:isToday?acc:'#888'}}>{DAYS[i]}</div>
                <div style={{fontSize:'16px',fontWeight:800,color:isToday?acc:'#333'}}>{date.getDate()}</div>
              </div>
              <div style={{flex:1,minHeight:'28px',display:'flex',alignItems:'center'}}>
                {assigned.length===0&&<span style={{fontSize:'11px',color:'#ccc',fontStyle:'italic'}}>미배정</span>}
              </div>
              {/* Edit button */}
              <button onClick={()=>startEdit(dk)} style={{background:'#f3f4f6',border:'none',cursor:'pointer',borderRadius:'6px',width:'28px',height:'28px',display:'flex',alignItems:'center',justifyContent:'center',flexShrink:0}} title="배정"><Icon name="UserPlus" size={13} style={{color:'#888'}}/></button>
            </div>
            {/* Assigned items */}
            {assigned.length>0&&(
              <div style={{display:'flex',flexDirection:'column',gap:'4px',marginLeft:'44px'}}>
                {assigned.map((item,ai)=>{
                  const zd=SP_ZONES.find(z=>z.id===item.zoneId)||{icon:'📋',name:item.zoneId,color:'#888'};
                  const completed=done.some(p=>p.inspector===item.name&&(p.zoneId===item.zoneId||p.zone===zd.name));
                  return(<div key={ai} onClick={()=>{if(!completed)startFromSchedule(dateStr,item)}} style={{display:'flex',alignItems:'center',gap:'6px',padding:'6px 10px',borderRadius:'8px',cursor:completed?'default':'pointer',transition:'all .15s',
                    background:completed?'#f0fdf4':'#fff',border:`1px solid ${completed?'#bbf7d0':'#e5e7eb'}`}}
                    onMouseOver={e=>{if(!completed)e.currentTarget.style.background='#e0f2fe'}}
                    onMouseOut={e=>{if(!completed)e.currentTarget.style.background='#fff'}}>
                    <span style={{fontSize:'14px'}}>{zd.icon}</span>
                    <span style={{fontSize:'12px',fontWeight:700,color:'#333'}}>{item.name}</span>
                    <span style={{fontSize:'10px',color:zd.color,fontWeight:600,background:zd.color+'15',padding:'1px 6px',borderRadius:'4px'}}>{zd.name}</span>
                    <div style={{flex:1}}/>
                    {completed?(
                      <span style={{fontSize:'10px',color:'#16a34a',fontWeight:700,display:'flex',alignItems:'center',gap:'2px'}}>✅ 완료</span>
                    ):(
                      <span style={{fontSize:'10px',color:acc,fontWeight:600,display:'flex',alignItems:'center',gap:'2px'}}><Icon name="Play" size={10}/> 점검</span>
                    )}
                  </div>);
                })}
              </div>
            )}
          </div>);
        })}
      </div>

      {/* 이번 주 점검 현황 */}
      {(()=>{
        const weekDts=weekDates.map(d=>fmtDate(d));
        const assignedNames=[...new Set(DAY_KEYS.flatMap(dk=>(ws[dk]||[]).map(it=>it.name)))];
        if(assignedNames.length===0)return null;
        const totalAssigned=DAY_KEYS.reduce((s,dk)=>(s+(ws[dk]||[]).length),0);
        const totalDone=DAY_KEYS.reduce((s,dk)=>{
          const dateStr=fmtDate(weekDates[DAY_KEYS.indexOf(dk)]);
          return s+(ws[dk]||[]).filter(item=>{
            const zd=SP_ZONES.find(z=>z.id===item.zoneId);
            return patrols.some(p=>p.date===dateStr&&p.inspector===item.name&&(p.zoneId===item.zoneId||p.zone===(zd?.name||'')));
          }).length;
        },0);
        return(<div style={{marginTop:'20px',background:'#fff',borderRadius:'12px',padding:'12px',border:'1px solid #e5e7eb'}}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'8px'}}>
            <span style={{fontSize:'12px',fontWeight:700,color:'#333'}}>📊 이번 주 현황</span>
            <span style={{fontSize:'11px',fontWeight:700,color:totalDone>=totalAssigned?'#16a34a':'#888'}}>{totalDone}/{totalAssigned} 완료</span>
          </div>
          <div style={{display:'flex',flexWrap:'wrap',gap:'6px'}}>
            {assignedNames.map(name=>{
              const asgn=DAY_KEYS.reduce((s,dk)=>s+(ws[dk]||[]).filter(it=>it.name===name).length,0);
              const cnt=DAY_KEYS.reduce((s,dk)=>{
                const dateStr=fmtDate(weekDates[DAY_KEYS.indexOf(dk)]);
                return s+(ws[dk]||[]).filter(it=>{
                  if(it.name!==name)return false;
                  const zd=SP_ZONES.find(z=>z.id===it.zoneId);
                  return patrols.some(p=>p.date===dateStr&&p.inspector===name&&(p.zoneId===it.zoneId||p.zone===(zd?.name||'')));
                }).length;
              },0);
              return(<div key={name} style={{fontSize:'11px',padding:'4px 8px',borderRadius:'6px',background:cnt>=asgn?'#dcfce7':'#f9fafb',border:'1px solid #e5e7eb'}}>
                <span style={{fontWeight:600}}>{name}</span>
                <span style={{color:cnt>=asgn?'#166534':'#999',marginLeft:'4px'}}>{cnt}/{asgn}</span>
              </div>);
            })}
          </div>
        </div>);
      })()}

      {/* Edit modal */}
      {editDay&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.4)',zIndex:100,display:'flex',alignItems:'center',justifyContent:'center',padding:'20px'}} onClick={()=>setEditDay(null)}>
          <div onClick={e=>e.stopPropagation()} style={{background:'#fff',borderRadius:'16px',padding:'20px',width:'100%',maxWidth:'380px',boxShadow:'0 20px 60px rgba(0,0,0,.2)'}}>
            <h3 style={{fontSize:'14px',fontWeight:800,marginBottom:'4px'}}>{DAYS[DAY_KEYS.indexOf(editDay)]}요일 점검 배정</h3>
            <p style={{fontSize:'11px',color:'#888',marginBottom:'12px'}}>점검자와 구역을 추가하세요</p>

            {/* Current items */}
            {editItems.length>0&&(
              <div style={{display:'flex',flexDirection:'column',gap:'4px',marginBottom:'12px'}}>
                {editItems.map((item,idx)=>{
                  const zd=SP_ZONES.find(z=>z.id===item.zoneId)||{icon:'📋',name:item.zoneId,color:'#888'};
                  return(<div key={idx} style={{display:'flex',alignItems:'center',gap:'6px',padding:'8px 10px',background:'#f0f9ff',borderRadius:'8px',border:'1px solid #bae6fd'}}>
                    <span>{zd.icon}</span>
                    <span style={{fontSize:'12px',fontWeight:700,flex:1}}>{item.name}</span>
                    <span style={{fontSize:'10px',color:zd.color,fontWeight:600}}>{zd.name}</span>
                    <button onClick={()=>removeItem(idx)} style={{background:'none',border:'none',cursor:'pointer',color:'#ef4444',padding:'2px'}}><Icon name="X" size={14}/></button>
                  </div>);
                })}
              </div>
            )}

            {/* Add new */}
            <div style={{display:'flex',gap:'6px',marginBottom:'12px'}}>
              <select value={addName} onChange={e=>setAddName(e.target.value)} style={{flex:1,padding:'8px',border:'1px solid #ddd',borderRadius:'8px',fontSize:'12px'}}>
                <option value="">점검자</option>
                {inspectors.map(n=>(<option key={n} value={n}>{n}</option>))}
              </select>
              <select value={addZone} onChange={e=>setAddZone(e.target.value)} style={{flex:1,padding:'8px',border:'1px solid #ddd',borderRadius:'8px',fontSize:'12px'}}>
                <option value="">구역</option>
                {SP_ZONES.map(z=>(<option key={z.id} value={z.id}>{z.icon} {z.name}</option>))}
              </select>
              <button onClick={addItem} disabled={!addName||!addZone} style={{padding:'8px 12px',background:addName&&addZone?grd:'#e5e7eb',color:addName&&addZone?'#fff':'#999',border:'none',borderRadius:'8px',fontSize:'12px',fontWeight:700,cursor:addName&&addZone?'pointer':'not-allowed',whiteSpace:'nowrap'}}>+</button>
            </div>

            {inspectors.length===0&&(
              <p style={{fontSize:'12px',color:'#999',textAlign:'center',padding:'8px'}}>⚠️ 설정에서 점검자를 먼저 등록해주세요</p>
            )}

            </div>
          </div>
        </div>
      )}
    </div>);
  };

  // ===== 설정 탭 =====
  const SettingsTab=()=>{
    const[newName,setNewName]=useState('');
    const addInspector=()=>{
      const n=newName.trim();if(!n)return;
      if(inspectors.includes(n)){alert('이미 등록된 점검자입니다.');return;}
      const updated=[...inspectors,n];
      setInspectors(updated);setNewName('');
      spApi.post({action:'saveInspectors',inspectors:updated});
    };
    const delInspector=(name)=>{
      if(!confirm(`"${name}"을(를) 삭제하시겠습니까?`))return;
      const updated=inspectors.filter(n=>n!==name);
      setInspectors(updated);
      spApi.post({action:'saveInspectors',inspectors:updated});
    };
    return(<div style={{padding:'16px',maxWidth:'500px',margin:'0 auto'}}>

        </div>
        {inspectors.length===0?(
          <p style={{fontSize:'12px',color:'#999',textAlign:'center',padding:'12px'}}>등록된 점검자가 없습니다</p>
        ):(
          <div style={{display:'flex',flexDirection:'column',gap:'4px'}}>
            {inspectors.map((name,i)=>(
              <div key={name} style={{display:'flex',alignItems:'center',gap:'8px',padding:'8px 10px',background:'#f9fafb',borderRadius:'8px'}}>
                <span style={{fontSize:'12px',fontWeight:700,color:'#333',flex:1}}>{name}</span>
                <button onClick={()=>delInspector(name)} style={{background:'none',border:'none',cursor:'pointer',color:'#ef4444',padding:'4px'}}><Icon name="X" size={14}/></button>

          </div>

      </div>

      {/* GAS 연결 상태 */}
      <div style={{marginTop:'16px',background:'#fff',borderRadius:'12px',padding:'12px',border:'1px solid #e5e7eb',fontSize:'12px'}}>
        <div style={{display:'flex',alignItems:'center',gap:'6px'}}>
          <div style={{width:'8px',height:'8px',borderRadius:'50%',background:SP_GAS_URL?'#22c55e':'#ef4444'}}/>
          <span style={{fontWeight:600}}>Google Sheets</span>
          <span style={{color:'#999'}}>{SP_GAS_URL?'연결됨':'미연결 (로컬 저장)'}</span>
        </div>
      </div>
    </div>);
  };

  // ===== 점검 탭 =====
  const CheckTab=()=>{
    if(!zone){
      return(<div style={{padding:'16px',maxWidth:'500px',margin:'0 auto'}}>
        <p style={{fontSize:'13px',color:'#666',marginBottom:'16px',textAlign:'center'}}>점검 구역을 선택해주세요</p>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'12px'}}>
          {SP_ZONES.map(z=>(
            <button key={z.id} onClick={()=>setZone(z.id)} style={{background:'#fff',border:'2px solid #e5e7eb',borderRadius:'16px',padding:'20px 12px',cursor:'pointer',display:'flex',flexDirection:'column',alignItems:'center',gap:'8px',transition:'all .2s'}} onMouseOver={e=>{e.currentTarget.style.borderColor=z.color;e.currentTarget.style.transform='translateY(-2px)'}} onMouseOut={e=>{e.currentTarget.style.borderColor='#e5e7eb';e.currentTarget.style.transform='none'}}>
              <span style={{fontSize:'32px'}}>{z.icon}</span>
              <span style={{fontSize:'14px',fontWeight:700,color:'#333'}}>{z.name}</span>
              <span style={{fontSize:'10px',color:'#999'}}>{z.questions.length}문항</span>
            </button>
          ))}
        </div>
      </div>);
    }

    const zoneData=SP_ZONES.find(z=>z.id===zone);
    const answeredCount=zoneData.questions.filter(q=>getAns(q.no).result).length;
    const progress=Math.round((answeredCount/zoneData.questions.length)*100);

    return(<div style={{padding:'16px',maxWidth:'600px',margin:'0 auto'}}>

      <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'16px'}}>
        <button onClick={()=>{if(answeredCount>0&&!confirm('작성 중인 내용이 사라집니다. 돌아가시겠습니까?'))return;resetForm()}} style={{background:'#f3f4f6',border:'none',cursor:'pointer',borderRadius:'8px',width:'32px',height:'32px',display:'flex',alignItems:'center',justifyContent:'center'}}><Icon name="ArrowLeft" size={16}/></button>

                      ...(a.result===opt?{

                    }}>{opt}</button>
                  ))}
                </div>
                <input value={a.comment||''} onChange={e=>setAns(q.no,'comment',e.target.value)} placeholder="Comment" style={{flex:1,padding:'5px 8px',border:'1px solid #e5e7eb',borderRadius:'6px',fontSize:'11px',minWidth:0}}/>
              </div>
            </div>
            {/* Sub question */}
            {showSub&&(
              <div style={{marginLeft:'20px',marginTop:'6px',background:'#fffbeb',borderRadius:'10px',padding:'10px 12px',border:'1px solid #fde68a'}}>

                </div>
                <textarea value={(getAns(q.sub.no).comment)||''} onChange={e=>setAns(q.sub.no,'comment',e.target.value)} rows={2} placeholder="내용을 입력하세요..." style={{width:'100%',padding:'6px 8px',border:'1px solid #fde68a',borderRadius:'6px',fontSize:'11px',resize:'vertical',background:'#fff'}}/>

      </div>

      {/* Findings */}
      <div style={{marginTop:'16px',background:'#fff',borderRadius:'12px',padding:'12px',border:'1px solid #e5e7eb'}}>
        <div style={{display:'flex',alignItems:'center',gap:'6px',marginBottom:'8px'}}>
          <Icon name="AlertTriangle" size={14} style={{color:'#f59e0b'}}/>
          <span style={{fontSize:'12px',fontWeight:700,color:'#333'}}>Findings (safety concerns)</span>
        </div>
        <textarea value={findings} onChange={e=>setFindings(e.target.value)} rows={3} placeholder="발견된 안전 문제사항을 기록해주세요..." style={{width:'100%',padding:'8px',border:'1px solid #e5e7eb',borderRadius:'8px',fontSize:'12px',resize:'vertical'}}/>
      </div>

      <button onClick={handleSubmit} style={{width:'100%',padding:'14px',marginTop:'16px',background:grd,color:'#fff',border:'none',borderRadius:'12px',fontSize:'14px',fontWeight:700,cursor:'pointer',boxShadow:'0 4px 12px rgba(14,165,233,.3)',display:'flex',alignItems:'center',justifyContent:'center',gap:'8px'}}>
        <Icon name="Send" size={16}/> 점검 제출
      </button>
    </div>);
  };

  // ===== 목록 탭 =====
  const ListTab=()=>{
    const[expandId,setExpandId]=useState(null);
    const[filterZone,setFilterZone]=useState('all');
    const filtered=patrols.filter(p=>filterZone==='all'||p.zoneId===filterZone||p.zone===SP_ZONES.find(z=>z.id===filterZone)?.name);

    return(<div style={{padding:'16px',maxWidth:'600px',margin:'0 auto'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'12px'}}>
        <span style={{fontSize:'13px',fontWeight:600,color:'#666'}}>총 <span style={{color:acc,fontWeight:800}}>{filtered.length}</span>건</span>
        <select value={filterZone} onChange={e=>setFilterZone(e.target.value)} style={{padding:'4px 10px',borderRadius:'6px',border:'1px solid #ddd',fontSize:'12px'}}>
          <option value="all">전체 구역</option>
          {SP_ZONES.map(z=>(<option key={z.id} value={z.id}>{z.name}</option>))}
        </select>
      </div>
      {filtered.length===0?(
        <div style={{textAlign:'center',padding:'40px',color:'#999'}}>
          <div style={{fontSize:'36px',marginBottom:'8px'}}>📋</div>
          <p style={{fontSize:'13px',fontWeight:600}}>점검 내역이 없습니다</p>
        </div>
      ):(
        <div style={{display:'flex',flexDirection:'column',gap:'8px'}}>
          {filtered.sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(p=>{
            const zoneData=SP_ZONES.find(z=>z.id===p.zoneId||z.name===p.zone)||{icon:'📋',color:'#666',questions:[]};
            const ans=p.answers||{};
            const yCount=Object.values(ans).filter(a=>a.result==='Y').length;
            const nCount=Object.values(ans).filter(a=>a.result==='N').length;
            const expanded=expandId===p.id;
            return(<div key={p.id} style={{background:'#fff',borderRadius:'12px',border:'1px solid #e5e7eb',overflow:'hidden'}}>
              <div onClick={()=>setExpandId(expanded?null:p.id)} style={{padding:'12px',cursor:'pointer',display:'flex',alignItems:'center',gap:'10px'}}>
                <span style={{fontSize:'20px'}}>{zoneData.icon}</span>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:'flex',alignItems:'center',gap:'6px',marginBottom:'2px'}}>
                    <span style={{fontSize:'12px',fontWeight:800,color:zoneData.color}}>{p.zone}</span>
                    <span style={{fontSize:'11px',color:'#999'}}>{p.date}</span>
                  </div>
                  <div style={{fontSize:'11px',color:'#666'}}>점검자: {p.inspector}</div>
                </div>
                <div style={{display:'flex',gap:'4px',flexShrink:0}}>
                  {yCount>0&&<span style={{fontSize:'10px',fontWeight:700,padding:'2px 6px',borderRadius:'4px',background:'#dcfce7',color:'#166534'}}>Y:{yCount}</span>}
                  {nCount>0&&<span style={{fontSize:'10px',fontWeight:700,padding:'2px 6px',borderRadius:'4px',background:'#fee2e2',color:'#991b1b'}}>N:{nCount}</span>}
                </div>
                <Icon name={expanded?"ChevronUp":"ChevronDown"} size={16} style={{color:'#ccc'}}/>
              </div>
              {expanded&&(
                <div style={{padding:'0 12px 12px',borderTop:'1px solid #f3f4f6'}}>
                  {zoneData.questions.map(q=>{
                    const a=ans[q.no]||{};
                    if(!a.result)return null;
                    return(<div key={q.no} style={{display:'flex',gap:'6px',padding:'4px 0',fontSize:'11px',borderBottom:'1px solid #fafafa'}}>
                      <span style={{fontWeight:700,color:'#888',width:'24px',flexShrink:0}}>Q{q.no}</span>
                      <span style={{padding:'1px 6px',borderRadius:'3px',fontWeight:700,fontSize:'10px',flexShrink:0,
                        ...(a.result==='Y'?{background:'#dcfce7',color:'#166534'}:a.result==='N'?{background:'#fee2e2',color:'#991b1b'}:{background:'#f3f4f6',color:'#666'})
                      }}>{a.result}</span>
                      <span style={{color:'#666',flex:1}}>{a.comment||''}</span>
                    </div>);
                  })}
                  {/* Sub answers */}
                  {zoneData.questions.filter(q=>q.sub&&ans[q.sub.no]?.comment).map(q=>(
                    <div key={q.sub.no} style={{display:'flex',gap:'6px',padding:'4px 0',fontSize:'11px',borderBottom:'1px solid #fafafa'}}>
                      <span style={{fontWeight:700,color:'#d97706',width:'24px',flexShrink:0}}>Q{q.sub.no}</span>
                      <span style={{color:'#78350f',flex:1}}>{ans[q.sub.no].comment}</span>
                    </div>
                  ))}
                  {p.findings&&(
                    <div style={{marginTop:'6px',padding:'8px',background:'#fef3c7',borderRadius:'6px',fontSize:'11px'}}>
                      <span style={{fontWeight:700,color:'#92400e'}}>Findings: </span>
                      <span style={{color:'#78350f'}}>{p.findings}</span>
                    </div>
                  )}
                  <button onClick={()=>delPatrol(p.id)} style={{marginTop:'8px',padding:'6px 12px',background:'#fee2e2',color:'#991b1b',border:'none',borderRadius:'6px',fontSize:'11px',fontWeight:600,cursor:'pointer'}}>삭제</button>
                </div>
              )}
            </div>);
          })}
        </div>
      )}
    </div>);
  };

  // ===== 성공 모달 =====
  const SuccessOverlay=showSuccess&&(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.4)',zIndex:100,display:'flex',alignItems:'center',justifyContent:'center'}}>
      <div className="pop-in" style={{background:'#fff',borderRadius:'20px',padding:'40px',textAlign:'center',boxShadow:'0 20px 60px rgba(0,0,0,.2)'}}>
        <div style={{fontSize:'48px',marginBottom:'12px'}}>✅</div>
        <p style={{fontSize:'16px',fontWeight:800,color:'#333'}}>점검 제출 완료!</p>
      </div>

  );

  return(<div style={{display:'flex',flexDirection:'column',height:'100vh',background:'#f0f4ff'}}>
    {/* Header */}
    <div style={{flexShrink:0,background:grd,padding:'10px 16px',display:'flex',alignItems:'center',gap:'10px',boxShadow:'0 2px 12px rgba(14,165,233,.3)'}}>
      <button onClick={onBack} style={{background:'rgba(255,255,255,.15)',border:'none',cursor:'pointer',color:'#fff',borderRadius:'10px',width:'34px',height:'34px',display:'flex',alignItems:'center',justifyContent:'center'}}><Icon name="ArrowLeft" size={20}/></button>
      <span style={{fontSize:'24px'}}>👁️</span>
      <h1 style={{color:'#fff',fontSize:'15px',fontWeight:800,margin:0,flex:1}}>Safety Patrol</h1>
      {!SP_GAS_URL&&<span style={{fontSize:'10px',background:'rgba(255,255,255,.2)',color:'#fff',padding:'2px 8px',borderRadius:'4px'}}>로컬</span>}
    </div>

    {/* Content */}
    <div style={{flex:1,overflow:'auto',paddingBottom:'70px'}}>
      {tab==='schedule'&&<ScheduleTab/>}
      {tab==='check'&&<CheckTab/>}
      {tab==='list'&&<ListTab/>}
      {tab==='settings'&&<SettingsTab/>}
    </div>

    {/* Bottom tabs */}
    <nav style={{position:'fixed',bottom:0,left:0,right:0,background:'#fff',borderTop:'1px solid #e5e7eb',boxShadow:'0 -4px 20px rgba(0,0,0,.05)',zIndex:40}}>
      <div style={{maxWidth:'600px',margin:'0 auto',display:'flex'}}>
        {[{id:'schedule',label:'스케줄',icon:'Calendar'},{id:'check',label:'점검',icon:'ClipboardCheck'},{id:'list',label:'목록',icon:'List'},{id:'settings',label:'설정',icon:'Settings'}].map(t=>(
          <button key={t.id} onClick={()=>{
            if((t.id==='list'||t.id==='settings')&&!isAdmin){const pw=prompt('관리자 비밀번호를 입력하세요:');if(pw!==ADMIN_PW){if(pw!==null)alert('비밀번호가 틀립니다.');return;}setIsAdmin(true);}
            setTab(t.id);
          }} style={{flex:1,padding:'10px 0',display:'flex',flexDirection:'column',alignItems:'center',gap:'3px',border:'none',background:'transparent',cursor:'pointer',position:'relative'}}>
            {tab===t.id&&<div style={{position:'absolute',top:0,left:'20%',right:'20%',height:'3px',borderRadius:'0 0 3px 3px',background:grd}}/>}
            <Icon name={t.icon} size={20} style={{color:tab===t.id?acc:'#9ca3af'}}/>
            <span style={{fontSize:'11px',fontWeight:tab===t.id?700:500,color:tab===t.id?acc:'#9ca3af'}}>{t.label}</span>
          </button>
        ))}
      </div>
    </nav>

    {SuccessOverlay}

    {/* Footer */}
    <div style={{position:'fixed',bottom:'56px',left:0,right:0,textAlign:'center',padding:'4px',fontSize:'9px',color:'#ccc',pointerEvents:'none'}}>
      Managed by Inhee / Built by SM
    </div>
  </div>);
}
// ===== Safety Tracker =====
function SafetyApp({onBack}){
  const curY=new Date().getFullYear();const curM=new Date().getMonth()+1;
  const[year,setYear]=useState(()=>S.get('safety_year',curY));
  const[month,setMonth]=useState(()=>S.get('safety_month',curM));
  const[fyGoals,setFyGoals]=useState(()=>S.get('safety_fygoals',{}));
  const[headcount,setHeadcount]=useState(()=>S.get('safety_headcount',{}));
  const[isAdmin,setIsAdmin]=useState(false);
  const[showTrackerSettings,setShowTrackerSettings]=useState(false);
  const ADMIN_PW='eaton12!@';
  useEffect(()=>{S.set('safety_year',year)},[year]);
  useEffect(()=>{S.set('safety_month',month)},[month]);
  useEffect(()=>{S.set('safety_fygoals',fyGoals)},[fyGoals]);
  useEffect(()=>{S.set('safety_headcount',headcount)},[headcount]);

  // Headcount helpers
  const getHC=(dept,m)=>headcount[`${year}_${dept}_${m}`]||0;
  const setHC=(dept,m,val)=>{const v=val===''?0:Number(val)||0;setHeadcount(prev=>({...prev,[`${year}_${dept}_${m}`]:v}))};
  const piFYGoal=(dept)=>{let t=0;for(let m=1;m<=12;m++)t+=getHC(dept,m);return t};
  const piYTDGoal=(dept)=>{let t=0;for(let m=1;m<=month;m++)t+=getHC(dept,m);return t};

  // Read live data & settings
  const piItems=S.get('pi_items',[]);
  const gembaItems=S.get('gemba_items',[]);
  const wraItems=S.get('wra_items',[]).map(it=>it.years?it:{...it,originYear:2026,years:{2026:{plan:it.review2026||'',rev:it.revision2026||'',excluded:false}}});
  const piSettings=S.get('pi_settings',{departments:[]});
  const gembaSettings=S.get('gemba_settings',{departments:[]});
  const wraSettings=S.get('wra_settings',{depts:[]});

  // Union all departments (WRA depts first)
  const DEPTS=useMemo(()=>{
    const s=new Set();
    (piSettings.departments||[]).forEach(d=>s.add(d));
    (gembaSettings.departments||[]).forEach(d=>s.add(d));
    (wraSettings.depts||[]).forEach(d=>s.add(d));
    const all=[...s];
    const wraDepts=new Set((wraSettings.depts||[]));
    return all.sort((a,b)=>{const ha=wraDepts.has(a)?0:1;const hb=wraDepts.has(b)?0:1;return ha-hb});
  },[]);
  const hasWRA=(dept)=>(wraSettings.depts||[]).includes(dept);
  const wraNoBg='#d6d3a8';

  // Date helpers
  const inYTD=(dateStr,y,m)=>{if(!dateStr)return false;const mt=dateStr.match(/(\d{4})-(\d{2})/);if(!mt)return false;const dy=parseInt(mt[1]),dm=parseInt(mt[2]);return dy===y&&dm>=1&&dm<=m};
  const inMonth=(dateStr,y,m)=>{if(!dateStr)return false;const mt=dateStr.match(/(\d{4})-(\d{2})/);if(!mt)return false;return parseInt(mt[1])===y&&parseInt(mt[2])===m};
  const inYear=(dateStr,y)=>{if(!dateStr)return false;const mt=dateStr.match(/(\d{4})/);return mt&&parseInt(mt[1])===y};

  // FY Goal get/set
  const getFY=(sec,dept)=>fyGoals[`${sec}_${dept}`]||0;
  const setFY=(sec,dept,val)=>{const v=val===''?0:Number(val)||0;setFyGoals(prev=>({...prev,[`${sec}_${dept}`]:v}))};

  // Auto calculations - PI (headcount based: 1 per person per month)
  const ytdGoalPI=(dept)=>piYTDGoal(dept);
  const ytdActualPI=(dept)=>piItems.filter(it=>it.department===dept&&inYTD(it.date,year,month)).length;
  const monthlyPI=(dept)=>piItems.filter(it=>it.department===dept&&inMonth(it.date,year,month)).length;

  // Auto calculations - Gemba (fixed 2/month/dept)
  const gembaFYGoal=24;
  const gembaYTDGoal=(dept)=>2*month;

  // Auto calculations - Gemba
  const ytdActualGemba=(dept)=>gembaItems.filter(it=>it.dept===dept&&inYTD(it.date,year,month)).length;
  const monthlyGemba=(dept)=>gembaItems.filter(it=>it.dept===dept&&inMonth(it.date,year,month)).length;

  // Auto calculations - WRA (new years structure)
  const wraGetYD=(item,yr)=>item.years?.[yr]||{};
  const wraActive=(dept)=>wraItems.filter(it=>it.dept===dept&&!wraGetYD(it,year).excluded);
  const wraCount=(dept)=>wraActive(dept).length;
  const wraPlanned=(dept)=>wraActive(dept).filter(it=>wraGetYD(it,year).plan).length;
  const wraCompleted=(dept)=>wraActive(dept).filter(it=>{const r=wraGetYD(it,year).rev;return r&&inYTD(r,year,month)}).length;
  const monthlyWRA=(dept)=>wraActive(dept).filter(it=>{const r=wraGetYD(it,year).rev;return r&&inMonth(r,year,month)}).length;
  const wraFYGoal=(dept)=>{const p=wraActive(dept).length;return p>0?'100%':''};
  const wraYTDGoal=(dept)=>{const p=wraPlanned(dept);return p>0?'100%':''};
  const wraYTDActual=(dept)=>{const p=wraPlanned(dept);if(!p)return'';const c=wraCompleted(dept);return Math.round(c/p*100)+'%'};

  // Pct helpers
  const pctVal=(a,g)=>(!g?'':Math.round(a/g*100)+'%');
  const pctBg=(a,g)=>{if(!g)return'#fff';const p=a/g*100;if(p>=100)return'#92d050';if(p>=90)return'#ffff00';return'#ff0000'};
  const wraPctBg=(dept)=>{const p=wraPlanned(dept);if(!p)return'#fff';const c=wraCompleted(dept);const pct=c/p*100;if(pct>=100)return'#92d050';if(pct>=90)return'#ffff00';return'#ff0000'};

  const bd='1px solid #8ea9db';const bdB='1px solid #000';
  const c={padding:'3px 4px',border:bd,textAlign:'center',fontSize:'11px',whiteSpace:'nowrap',background:'#fff'};
  const inp={width:'100%',padding:'1px',border:'none',background:'transparent',fontSize:'11px',textAlign:'center',outline:'none',minWidth:'38px'};
  const periodC={...c,fontWeight:600,textAlign:'center',borderRight:bdB};
  const mNum={...c,background:'#fff',fontWeight:700,verticalAlign:'middle',textAlign:'center',fontSize:'14px',borderRight:bdB};
  const mItem={...c,background:'#fff',fontWeight:600,verticalAlign:'middle',textAlign:'left',paddingLeft:'8px',fontSize:'11px',borderRight:bdB};
  const mDef={...c,background:'#fff',verticalAlign:'middle',textAlign:'left',paddingLeft:'8px',fontSize:'10px',borderRight:bdB};
  const AC=({v})=>(<td style={{...c,background:v>0?'#c6efce':'#fff',fontWeight:v>0?700:400}}>{v}</td>);
  const AutoTD=({v,bg})=>(<td style={{...c,background:bg||'#fff'}}>{v}</td>);
  const PctTD=({a,g})=>{const bg=g?pctBg(a,g):'#fff';return(<td style={{...c,background:bg,fontWeight:600}}>{pctVal(a,g)}</td>)};

  const periodLabel=`${year}년 ${month}월`;
  const MN=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];const mn=MN[month];
  const ss={padding:'4px 6px',borderRadius:'3px',border:'1px solid #555',background:'#333',color:'#fff',fontSize:'12px',outline:'none',cursor:'pointer'};

  // ===== PPT Export =====
  const exportPPT=()=>{
    const PptxGen=window.PptxGenJS||window.pptxgen;
    if(!PptxGen){alert('PPT 라이브러리 로딩 실패.');return;}
    const pptx=new PptxGen();
    pptx.layout='LAYOUT_WIDE';
    const slide=pptx.addSlide();
    slide.background={color:'FFFFFF'};

    const nd=DEPTS.length;
    const fixW=[0.3,0.85,0.95,1.05];
    const deptW=Math.min((13.0-fixW.reduce((a,b)=>a+b,0))/nd, 1.2);
    const colW=[...fixW,...Array(nd).fill(deptW)];

    // Border presets
    const thin={type:'solid',color:'8EA9DB',pt:0.5};
    const thick={type:'solid',color:'000000',pt:1.2};
    const med={type:'solid',color:'000000',pt:0.7};

    // Cell builder
    const C=(text,opts={})=>{
      const o={fontFace:'맑은 고딕',fontSize:7,color:'000000',align:'center',valign:'middle',
        border:[thin,thin,thin,thin],fill:{color:'FFFFFF'},...opts};
      return{text:String(text??''),options:o};
    };

    // Flat rows - each row has ALL columns
    const R=[];

    // ========== ROW 0: Header ==========
    R.push([
      C('',{fill:{color:'C5D9F1'},bold:true,border:[thick,thin,thick,thick]}),
      C('Items',{fill:{color:'C5D9F1'},bold:true,border:[thick,thin,thick,thin]}),
      C('Definition',{fill:{color:'C5D9F1'},bold:true,border:[thick,thin,thick,thin]}),
      C('Period',{fill:{color:'C5D9F1'},bold:true,border:[thick,med,thick,thin]}),
      C('Departmental score',{fill:{color:'4472C4'},color:'FFFFFF',fontSize:11,bold:true,colspan:nd,border:[thick,thick,thick,med]})
    ]);

    // Helper for section sub-header (period label + dept names row)
    const subHdr=(num,item,def,color)=>{
      R.push([
        C(num,{bold:true,fontSize:11,fill:{color:'FFFFFF'},border:[thick,med,thin,thick]}),
        C(item,{bold:true,align:'left',fill:{color:'FFFFFF'},border:[thick,thin,thin,thin]}),
        C(def,{align:'left',fontSize:6.5,fill:{color:'FFFFFF'},border:[thick,thin,thin,thin]}),
        C(periodLabel,{fill:{color},bold:true,border:[thick,med,thin,thin]}),
        ...DEPTS.map((d,i)=>C(d,{fill:{color},bold:true,border:[thick,i===nd-1?thick:thin,thin,thin]}))
      ]);
    };
    // Helper for data row inside section
    const dRow=(num,item,def,label,vals,labelOpts={})=>{
      R.push([
        C(num,{bold:true,fontSize:11,fill:{color:'FFFFFF'},border:[thin,med,thin,thick]}),
        C(item,{bold:true,align:'left',fill:{color:'FFFFFF'},border:[thin,thin,thin,thin]}),
        C(def,{align:'left',fontSize:6.5,fill:{color:'FFFFFF'},border:[thin,thin,thin,thin]}),
        C(label,{bold:true,border:[thin,med,thin,thin],...labelOpts}),
        ...vals.map((v,i)=>{const cell={...v};if(i===nd-1){cell.options={...cell.options,border:[thin,thick,thin,thin]};}return cell;})
      ]);
    };
    // Last row of section (thick bottom border)
    const lastRow=(num,item,def,label,vals,labelOpts={})=>{
      R.push([
        C(num,{bold:true,fontSize:11,fill:{color:'FFFFFF'},border:[thin,med,thick,thick]}),
        C(item,{bold:true,align:'left',fill:{color:'FFFFFF'},border:[thin,thin,thick,thin]}),
        C(def,{align:'left',fontSize:6.5,fill:{color:'FFFFFF'},border:[thin,thin,thick,thin]}),
        C(label,{bold:true,border:[thin,med,thick,thin],...labelOpts}),
        ...vals.map((v,i)=>{const cell={...v};cell.options={...cell.options,border:[thin,i===nd-1?thick:thin,thick,thin]};return cell;})
      ]);
    };

    // ========== SECTION 1: PI ==========
    subHdr('1','Positive\nInterruption','# of PI report','B4C6E7');
    dRow('','','','FY Goal',DEPTS.map(d=>C(piFYGoal(d)||'')));
    dRow('','','',`YTD Goal (${mn})`,DEPTS.map(d=>C(piYTDGoal(d)||'')));
    dRow('','','','YTD Actual',DEPTS.map(d=>{const v=ytdActualPI(d);return C(v,{fill:{color:v>0?'C6EFCE':'FFFFFF'}})}));
    dRow('','','',`% vs YTD Goal (${mn})`,DEPTS.map(d=>{
      const g=ytdGoalPI(d),a=ytdActualPI(d);
      const bg=g?(a/g>=1?'92D050':a/g>=0.9?'FFFF00':'FF0000'):'FFFFFF';
      return C(pctVal(a,g),{fill:{color:bg},color:bg==='FF0000'?'FFFFFF':'000000',bold:true});
    }));
    lastRow('','','','Monthly Actual',DEPTS.map(d=>C(monthlyPI(d))),{fill:{color:'DCE6F1'}});

    // ========== SECTION 2: Gemba Walk ==========
    subHdr('2','# of OFI -\nGemba Walk','# of OFIs for\ndepartment\nGemba Walk','E6B8B7');
    dRow('','','','FY Goal',DEPTS.map(()=>C(gembaFYGoal)));
    dRow('','','',`YTD Goal (${mn})`,DEPTS.map(d=>C(gembaYTDGoal(d))));
    dRow('','','','YTD Actual',DEPTS.map(d=>{const v=ytdActualGemba(d);return C(v,{fill:{color:v>0?'C6EFCE':'FFFFFF'}})}));
    dRow('','','',`% vs YTD Goal (${mn})`,DEPTS.map(d=>{
      const g=gembaYTDGoal(d),a=ytdActualGemba(d);
      const bg=g?(a/g>=1?'92D050':a/g>=0.9?'FFFF00':'FF0000'):'FFFFFF';
      return C(pctVal(a,g),{fill:{color:bg},color:bg==='FF0000'?'FFFFFF':'000000',bold:true});
    }));
    lastRow('','','','Monthly Actual',DEPTS.map(d=>C(monthlyGemba(d))),{fill:{color:'F2DCDB'}});

    // ========== SECTION 3: WRA ==========
    const wrBg=(d,bg='FFFFFF')=>({color:hasWRA(d)?bg:'D6D3A8'});
    const wrV=(d,v,bg='FFFFFF')=>C(hasWRA(d)?v:'',{fill:wrBg(d,bg)});
    subHdr('3','WRA -\nRevisit ratio','Update\nabnormal /\nnon routine task','C4BD97');
    dRow('','','','# of WRA',DEPTS.map(d=>wrV(d,wraCount(d)||'')));
    dRow('','','',`# of Planned review\n(YTD Goal/${mn})`,DEPTS.map(d=>wrV(d,wraPlanned(d)||'')),{fontSize:6});
    dRow('','','',`# of completed review\n(YTD Actual)`,DEPTS.map(d=>{const v=hasWRA(d)?wraCompleted(d):0;return wrV(d,v,v>0?'C6EFCE':'FFFFFF')}),{fontSize:6});
    dRow('','','','Monthly Actual',DEPTS.map(d=>{const v=hasWRA(d)?monthlyWRA(d):0;return C(hasWRA(d)?v:'',{fill:wrBg(d,v>0?'C6EFCE':'FFFFFF'),bold:v>0})}),{fill:{color:'DDD5B6'}});
    dRow('','','','FY Goal',DEPTS.map(d=>wrV(d,wraFYGoal(d))));
    dRow('','','',`YTD Goal (${mn})`,DEPTS.map(d=>wrV(d,wraYTDGoal(d))));
    lastRow('','','','YTD Actual',DEPTS.map(d=>{
      if(!hasWRA(d))return C('',{fill:{color:'D6D3A8'}});
      const bg=wraPctBg(d)==='#92d050'?'92D050':wraPctBg(d)==='#ffff00'?'FFFF00':wraPctBg(d)==='#ff0000'?'FF0000':'FFFFFF';
      return C(wraYTDActual(d),{fill:{color:bg},bold:true,color:bg==='FF0000'?'FFFFFF':'000000'});
    }));

    slide.addTable(R,{x:0.15,y:0.1,w:13.0,colW:colW,rowH:0.22,autoPage:false});

    // Legend - fixed at bottom of slide
    const ly=7.1;
    const lg={fontSize:7,fontFace:'맑은 고딕',bold:true,align:'center',valign:'middle'};
    slide.addText('As Planned',{x:0.15,y:ly,w:0.8,h:0.22,...lg,fill:{color:'92D050'},line:{color:'000000',width:0.5}});
    slide.addText('Short to Plan by 10%',{x:1.05,y:ly,w:1.2,h:0.22,...lg,fill:{color:'FFFF00'},line:{color:'000000',width:0.5}});
    slide.addText('Short to Plan by >10%',{x:2.35,y:ly,w:1.2,h:0.22,...lg,fill:{color:'FF0000'},color:'FFFFFF',line:{color:'000000',width:0.5}});

    pptx.writeFile({fileName:`Safety_Tracker_${year}_${month}월.pptx`});
  };

  if(DEPTS.length===0)return(<div style={{display:'flex',flexDirection:'column',height:'100vh',background:'#f0f4ff'}}>
    <div style={{flexShrink:0,background:'linear-gradient(135deg,#667eea,#764ba2)',padding:'10px 16px',display:'flex',alignItems:'center',gap:'10px'}}>
      <button onClick={onBack} style={{background:'rgba(255,255,255,.15)',border:'none',cursor:'pointer',color:'#fff',borderRadius:'10px',width:'34px',height:'34px',display:'flex',alignItems:'center',justifyContent:'center'}}><Icon name="ArrowLeft" size={20}/></button>
      <span style={{fontSize:'24px'}}>🛡️</span>
      <h1 style={{color:'#fff',fontSize:'15px',fontWeight:800,margin:0}}>Safety Tracker</h1>
    </div>
    <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',flexDirection:'column',gap:'12px'}}>
      <Icon name="AlertCircle" size={48} style={{color:'#ccc'}}/>
      <p style={{fontSize:'14px',color:'#999'}}>PI, Gemba Walk, WRA에서 부서를 먼저 설정해주세요.</p>
    </div>
  </div>);

  return(<div style={{display:'flex',flexDirection:'column',height:'100vh',background:'#f0f4ff'}}>
    {/* Header */}
    <div style={{flexShrink:0,background:'linear-gradient(135deg,#667eea,#764ba2)',padding:'8px 16px',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
      <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
        <button onClick={onBack} style={{background:'rgba(255,255,255,.15)',border:'none',cursor:'pointer',color:'#fff',borderRadius:'10px',width:'34px',height:'34px',display:'flex',alignItems:'center',justifyContent:'center'}}><Icon name="ArrowLeft" size={20}/></button>
        <span style={{fontSize:'22px'}}>🛡️</span>
      </div>
      <h1 style={{fontSize:'16px',fontWeight:800,margin:0,color:'#fff',flex:1,textAlign:'center'}}>Safety Tracker — {periodLabel}</h1>
      <div style={{display:'flex',alignItems:'center',gap:'4px'}}>
        <button onClick={exportPPT} style={{background:'rgba(255,255,255,.25)',borderRadius:'10px',border:'none',cursor:'pointer',height:'34px',display:'flex',alignItems:'center',justifyContent:'center',gap:'4px',padding:'0 10px'}} title="PPT 내보내기"><Icon name="FileDown" size={14} style={{color:'#fff'}}/><span style={{color:'#fff',fontSize:'11px',fontWeight:700}}>PPT</span></button>
        <select value={year} onChange={e=>setYear(Number(e.target.value))} style={{...ss,background:'rgba(0,0,0,.25)',border:'1px solid rgba(255,255,255,.3)',color:'#fff'}}>{[curY-2,curY-1,curY,curY+1].map(y=>(<option key={y} value={y} style={{color:'#333',background:'#fff'}}>{y}</option>))}</select>
        <select value={month} onChange={e=>setMonth(Number(e.target.value))} style={{...ss,background:'rgba(0,0,0,.25)',border:'1px solid rgba(255,255,255,.3)',color:'#fff'}}>{[...Array(12)].map((_,i)=>(<option key={i+1} value={i+1} style={{color:'#333',background:'#fff'}}>{i+1}월</option>))}</select>
        <button onClick={()=>{const pw=prompt('관리자 비밀번호를 입력하세요:');if(pw===ADMIN_PW)setShowTrackerSettings(true);else if(pw!==null)alert('비밀번호가 틀립니다.')}} style={{background:'rgba(255,255,255,.2)',borderRadius:'10px',border:'none',cursor:'pointer',width:'34px',height:'34px',display:'flex',alignItems:'center',justifyContent:'center'}} title="설정"><Icon name="Settings" size={16} style={{color:'#fff'}}/></button>
      </div>
    </div>

    {/* Settings Modal */}
    {showTrackerSettings&&<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',zIndex:100,display:'flex',alignItems:'center',justifyContent:'center',padding:'16px'}} onClick={e=>{if(e.target===e.currentTarget)setShowTrackerSettings(false)}}>
      <div style={{background:'#fff',borderRadius:'16px',maxWidth:'95vw',maxHeight:'90vh',overflow:'auto',padding:'20px',boxShadow:'0 20px 60px rgba(0,0,0,0.3)',width:'800px'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'16px'}}>
          <h2 style={{fontSize:'16px',fontWeight:700,margin:0}}>📋 Safety Tracker 설정 — {year}년</h2>
          <button onClick={()=>setShowTrackerSettings(false)} style={{background:'none',border:'none',cursor:'pointer',padding:'4px'}}><Icon name="X" size={20}/></button>
        </div>
        <div style={{marginBottom:'20px'}}>
          <h3 style={{fontSize:'13px',fontWeight:700,color:'#2563eb',marginBottom:'8px'}}>1. PI — 부서별 월별 인원 (인원 × 1건/월 = 목표)</h3>
          <div style={{overflow:'auto'}}>
            <table style={{borderCollapse:'collapse',fontSize:'12px',width:'100%'}}>
              <thead><tr style={{background:'#e0e7ff'}}>
                <th style={{padding:'6px 8px',border:'1px solid #c7d2fe',textAlign:'left',fontWeight:600,whiteSpace:'nowrap'}}>부서</th>
                {[...Array(12)].map((_,i)=>(<th key={i} style={{padding:'6px 4px',border:'1px solid #c7d2fe',textAlign:'center',fontWeight:600,minWidth:'48px'}}>{i+1}월</th>))}
                <th style={{padding:'6px 8px',border:'1px solid #c7d2fe',textAlign:'center',fontWeight:700,background:'#c7d2fe'}}>FY합계</th>
              </tr></thead>
              <tbody>{DEPTS.map(dept=>(<tr key={dept}>
                <td style={{padding:'4px 8px',border:'1px solid #e5e7eb',fontWeight:600,fontSize:'11px'}}>{dept}</td>
                {[...Array(12)].map((_,i)=>(<td key={i} style={{padding:'1px',border:'1px solid #e5e7eb'}}>
                  <input value={getHC(dept,i+1)||''} onChange={e=>setHC(dept,i+1,e.target.value)} style={{width:'100%',padding:'4px 2px',border:'none',textAlign:'center',fontSize:'12px',outline:'none',background:i+1<=month?'#fff':'#f9fafb'}} placeholder="0"/>
                </td>))}
                <td style={{padding:'4px',border:'1px solid #e5e7eb',textAlign:'center',fontWeight:700,background:'#f0f4ff',fontSize:'12px'}}>{piFYGoal(dept)}</td>
              </tr>))}</tbody>
            </table>
          </div>
          <p style={{fontSize:'10px',color:'#6b7280',marginTop:'4px'}}>* 인원 1명 = 월 1건 목표. YTD Goal = 1월~선택월 인원 합계</p>
        </div>
        <div style={{marginBottom:'20px',background:'#fef3c7',borderRadius:'8px',padding:'12px',border:'1px solid #fbbf24'}}>
          <h3 style={{fontSize:'13px',fontWeight:700,color:'#92400e',marginBottom:'4px'}}>2. Gemba Walk — 자동 설정</h3>
          <p style={{fontSize:'12px',color:'#78350f',margin:0}}>부서별 월 <b>2건</b> 고정 → FY Goal = <b>24</b>, YTD Goal = <b>2 × 선택월</b></p>
        </div>
        <div style={{background:'#f0fdf4',borderRadius:'8px',padding:'12px',border:'1px solid #86efac'}}>
          <h3 style={{fontSize:'13px',fontWeight:700,color:'#166534',marginBottom:'4px'}}>3. WRA — 자동 계산</h3>
          <p style={{fontSize:'12px',color:'#14532d',margin:0}}>WRA 모듈 데이터에서 자동 집계 (Plan/Rev 건수 기반 100%)</p>
        </div>
        <button onClick={()=>setShowTrackerSettings(false)} style={{marginTop:'16px',width:'100%',padding:'10px',background:'#2563eb',color:'#fff',border:'none',borderRadius:'8px',fontWeight:700,fontSize:'14px',cursor:'pointer'}}>닫기</button>
      </div>
    </div>}

    {/* Tracker Table */}
    <TableScaler>
      <table style={{borderCollapse:'collapse',fontSize:'11px',width:'max-content',border:'2px solid #000'}}>
        <thead style={{position:'sticky',top:0,zIndex:10}}>
          <tr>
            <th style={{...c,background:'#c5d9f1',fontWeight:700,width:'30px',borderBottom:'2px solid #000',borderRight:bdB}}></th>
            <th style={{...c,background:'#c5d9f1',fontWeight:700,minWidth:'100px',borderBottom:'2px solid #000',borderRight:bdB}}>Items</th>
            <th style={{...c,background:'#c5d9f1',fontWeight:700,minWidth:'120px',borderBottom:'2px solid #000',borderRight:bdB}}>Definition</th>
            <th style={{...c,background:'#c5d9f1',fontWeight:700,minWidth:'100px',borderBottom:'2px solid #000',borderRight:bdB}}>Period</th>
            <th colSpan={DEPTS.length} style={{...c,background:'#4472c4',color:'#fff',fontWeight:700,fontSize:'14px',borderBottom:'2px solid #000'}}>Departmental score</th>
          </tr>
        </thead>
        <tbody>

          {/* ===== SECTION 1: PI ===== */}
          <tr>
            <td rowSpan={6} style={{...mNum,borderTop:'2px solid #000'}}>1</td>
            <td rowSpan={6} style={{...mItem,borderTop:'2px solid #000'}}>Positive<br/>Interruption</td>
            <td rowSpan={6} style={{...mDef,borderTop:'2px solid #000'}}># of PI report</td>
            <td style={{...periodC,background:'#b4c6e7',borderTop:'2px solid #000'}}>{periodLabel}</td>
            {DEPTS.map(d=>(<td key={d} style={{...c,background:'#b4c6e7',fontWeight:700,minWidth:'58px',borderTop:'2px solid #000'}}>{d}</td>))}
          </tr>
          <tr><td style={periodC}>FY Goal</td>{DEPTS.map(d=>(<AutoTD key={d} v={piFYGoal(d)||''}/>))}</tr>
          <tr><td style={periodC}>YTD Goal ({mn})</td>{DEPTS.map(d=>(<AutoTD key={d} v={piYTDGoal(d)||''}/>))}</tr>
          <tr><td style={periodC}>YTD Actual</td>{DEPTS.map(d=>(<AutoTD key={d} v={ytdActualPI(d)} bg={ytdActualPI(d)>0?'#c6efce':'#fff'}/>))}</tr>
          <tr><td style={periodC}>% vs YTD Goal ({mn})</td>{DEPTS.map(d=>(<PctTD key={d} a={ytdActualPI(d)} g={ytdGoalPI(d)}/>))}</tr>
          <tr><td style={{...periodC,background:'#dce6f1'}}>Monthly Actual</td>{DEPTS.map(d=>(<AC key={d} v={monthlyPI(d)}/>))}</tr>

          {/* ===== SECTION 2: Gemba Walk ===== */}
          <tr>
            <td rowSpan={6} style={{...mNum,borderTop:'3px solid #000'}}>2</td>
            <td rowSpan={6} style={{...mItem,borderTop:'3px solid #000'}}># of OFI -<br/>Gemba Walk</td>
            <td rowSpan={6} style={{...mDef,borderTop:'3px solid #000'}}># of OFIs for<br/>department<br/>Gemba Walk</td>
            <td style={{...periodC,background:'#e6b8b7',borderTop:'3px solid #000'}}>{periodLabel}</td>
            {DEPTS.map(d=>(<td key={d} style={{...c,background:'#e6b8b7',fontWeight:700,borderTop:'3px solid #000'}}>{d}</td>))}
          </tr>
          <tr><td style={periodC}>FY Goal</td>{DEPTS.map(d=>(<AutoTD key={d} v={gembaFYGoal}/>))}</tr>
          <tr><td style={periodC}>YTD Goal ({mn})</td>{DEPTS.map(d=>(<AutoTD key={d} v={gembaYTDGoal(d)}/>))}</tr>
          <tr><td style={periodC}>YTD Actual</td>{DEPTS.map(d=>(<AutoTD key={d} v={ytdActualGemba(d)} bg={ytdActualGemba(d)>0?'#c6efce':'#fff'}/>))}</tr>
          <tr><td style={periodC}>% vs YTD Goal ({mn})</td>{DEPTS.map(d=>(<PctTD key={d} a={ytdActualGemba(d)} g={gembaYTDGoal(d)}/>))}</tr>
          <tr><td style={{...periodC,background:'#f2dcdb'}}>Monthly Actual</td>{DEPTS.map(d=>(<AC key={d} v={monthlyGemba(d)}/>))}</tr>

          {/* ===== SECTION 3: WRA ===== */}
          <tr>
            <td rowSpan={8} style={{...mNum,borderTop:'3px solid #000'}}>3</td>
            <td rowSpan={8} style={{...mItem,borderTop:'3px solid #000'}}>WRA -<br/>Revisit ratio</td>
            <td rowSpan={8} style={{...mDef,borderTop:'3px solid #000'}}>Update<br/>abnormal /<br/>non routine task</td>
            <td style={{...periodC,background:'#c4bd97',borderTop:'3px solid #000'}}>{periodLabel}</td>
            {DEPTS.map(d=>(<td key={d} style={{...c,background:hasWRA(d)?'#c4bd97':wraNoBg,fontWeight:700,borderTop:'3px solid #000'}}>{d}</td>))}
          </tr>
          <tr><td style={periodC}># of WRA</td>{DEPTS.map(d=>(<td key={d} style={{...c,background:hasWRA(d)?'#fff':wraNoBg}}>{hasWRA(d)?(wraCount(d)||''):''}</td>))}</tr>
          <tr><td style={{...periodC,fontSize:'10px'}}># of Planned review<br/>(YTD Goal/{mn})</td>{DEPTS.map(d=>(<td key={d} style={{...c,background:hasWRA(d)?'#fff':wraNoBg}}>{hasWRA(d)?(wraPlanned(d)||''):''}</td>))}</tr>
          <tr><td style={{...periodC,fontSize:'10px'}}># of completed review<br/>(YTD Actual)</td>{DEPTS.map(d=>(<td key={d} style={{...c,background:hasWRA(d)?(wraCompleted(d)>0?'#c6efce':'#fff'):wraNoBg}}>{hasWRA(d)?wraCompleted(d):''}</td>))}</tr>
          <tr><td style={{...periodC,background:'#ddd5b6'}}>Monthly Actual</td>{DEPTS.map(d=>(<td key={d} style={{...c,background:hasWRA(d)?(monthlyWRA(d)>0?'#c6efce':'#fff'):wraNoBg,fontWeight:monthlyWRA(d)>0?700:400}}>{hasWRA(d)?monthlyWRA(d):''}</td>))}</tr>
          <tr><td style={periodC}>FY Goal</td>{DEPTS.map(d=>(<td key={d} style={{...c,background:hasWRA(d)?'#fff':wraNoBg}}>{hasWRA(d)?wraFYGoal(d):''}</td>))}</tr>
          <tr><td style={periodC}>YTD Goal ({mn})</td>{DEPTS.map(d=>(<td key={d} style={{...c,background:hasWRA(d)?'#fff':wraNoBg}}>{hasWRA(d)?wraYTDGoal(d):''}</td>))}</tr>
          <tr><td style={periodC}>YTD Actual</td>{DEPTS.map(d=>(<td key={d} style={{...c,background:hasWRA(d)?wraPctBg(d):wraNoBg,fontWeight:600}}>{hasWRA(d)?wraYTDActual(d):''}</td>))}</tr>
        </tbody>
      </table>
      <div style={{padding:'8px 0',display:'flex',alignItems:'center',gap:'4px',fontSize:'10px'}}>
        <span style={{padding:'3px 24px',background:'#92d050',border:'1px solid #000',fontWeight:600}}>As Planned</span>
        <span style={{padding:'3px 24px',background:'#ffff00',border:'1px solid #000',fontWeight:600}}>Short to Plan by 10%</span>
        <span style={{padding:'3px 24px',background:'#ff0000',color:'#fff',border:'1px solid #000',fontWeight:600}}>Short to Plan by &gt;10%</span>
      </div>
    </TableScaler>

  </div>);
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
