{id:'procedures',title:'Procedures',titleKo:'절차서',icon:'FileCheck',en:'Procedures - Work Instructions/Std. Work are available and with key safety indications included (including PPE, adequate tools, etc.) and employees always abide/follow',ko:'절차서 - 작업 지침/작업 표준은 PPE, 적합한 공구 등, 주요 안전 지표와 함께 활용 가능하여야 하며, 직원은 항상 준수합니다'},
{id:'training',title:'Training',titleKo:'교육',icon:'GraduationCap',en:'Training - New or transferred employees have been trained and understand the Work station Risk Assessment and Work Instructions/Std. Work',ko:'Training - 신규 또는 작업 전환된 직원은 교육을 받았으며 WRA와 작업 지침을 이해했음'},
{id:'tools',title:'Tools',titleKo:'공구',icon:'Wrench',en:'Tools - Adequate tools are defined in the Work Instructions/Std. Work, they are available at the work station and in good conditions. Employees understand the line of fire risk when using the tools',ko:'Tools - 적절한 공구는 작업 지침/작업표준에 정의되어 있고, 작업장에서 사용할 수 있으며, 직원이 공구 사용 시의 위험 인자를 이해하고 있음'},
{id:'material',title:'Material Handling',titleKo:'자재 취급',icon:'Package',en:'Material Handling - Employees understand the risk of handling materials (ergonomics, slips and trips, falling objects, pinch points, etc.), there are enough lifting and transport devices available and in good conditions. All trolleys and transport devices are provided with handles and these are always used by employees. There is enough space in the workstation to handle material and in the transportation routes used by employees.',ko:'Material Handling - 직원은 자재 취급 위험(근골격계, 미끄러짐, 걸려 넘어짐, 낙하 물체, 협착포인트 등)을 충분히 이해하고 있으며, 양호한 상태의 충분한 리프팅 및 운송 장치가 있음. 모든 트롤리 및 운송 장치는 핸들이 설치되어 있으며, 직원이 항상 사용함. 작업대에는 자재를 취급할 수 있는 충분한 작업공간이 있으며 직원이 사용하는 이동 경로가 충분히 있다.'},
{id:'jams',title:'Jams',titleKo:'설비의 걸림',icon:'AlertOctagon',en:'Jams - Employees understand the risk of jams and the need to LOTO the equipment before attempting to remove the jam from the equipment. Adequate tools are identified and available to remove jams (when possible) instead of using the hands. Causes for reoccurring jams at the equipment are reported by employees and investigated.',ko:'Jams(설비의 걸림) - 직원들은 장비의 걸림 제거를 시도하기 전에 걸림의 위험과 장비 LOTO에 대한 필요성을 이해하고 있음. 걸림 제거에 필요한 공구는 준비되어 있고, 손을 이용하지 않고 적절한 도구를 이용하여 걸림을 조치함. 장비의 걸림 재발의 원인은 직원들에 의해 보고되고 조사됨'},
{id:'maintenance',title:'Maintenance',titleKo:'유지보수',icon:'Settings',en:'Maintenance - Are maintenance employees properly trained and do follow general safety procedures when performing maintenance (LOTO, Electrical Safety, identification and barricading, use and maintenance of adequate tools). Is a Non Routine Risk Assessment completed before a corrective maintenance is being performed (if there is no standard work for it).',ko:'Maintenance - 유지보수 직원은 적절히 교육되었고, 유지보수(LOTO, 전기 안전, 구역 식별 및 바리케이트, 적절한 도구의 사용 및 유지) 일반 안전 절차를 따라야 함. 유지보수를 실시하기 전에 비정기 작업의 위험 평가를 완료하고 있습니까(작업 표준이 없는 경우)?'},
{id:'machines',title:'Machines/Equipment',titleKo:'설비',icon:'Cog',en:'Machines/Equipment - Equipment properly guarded and safety inspections completed.',ko:'Machine/Equipment - 설비는 적합하게 보호조치 되었으며, 안전검사는 완료되었음'},
{id:'stopstand',title:'Stop Stand Back & Get Help',titleKo:'멈추고 물러서서 도움요청하기',icon:'Hand',en:'Stop Stand Back and Get Help - Are all employees aware of the need to stop, stand back and ask for help whenever they face a situation where no Work Instructions/Std. Work is available or they are not trained to perform or in doubt on how to do it safely',ko:'Stop Stand Back and Get Help - 모든 직원이 작업 지침/작업 표준이 없거나, 작업에 필요한 안전한 작업방법을 교육 받지 못했다면 중지(Stop), 뒤로 물러서(Stand Back) 도움을 요청(Get Help)해야 하는 필요성을 알고 있습니까?'},
{id:'site1',title:'Site Specific Topic 1',titleKo:'STF (미끄러짐/넘어짐/추락)',icon:'Footprints',en:'Site Specific Topic 1 - STF (Slips, Trips and Falls)',ko:'STF (미끄러짐/넘어짐/추락)'},

function SuccessModal({message,onClose}){useEffect(()=>{const t=setTimeout(onClose,2000);return()=>clearTimeout(t)},[]);return(<div className="fixed inset-0 bg-green-500 flex flex-col items-center justify-center z-50 fade-in" onClick={onClose}><div className="pop-in flex flex-col items-center"><svg className="w-28 h-28 mb-5" viewBox="0 0 100 100"><circle className="pop-in" cx="50" cy="50" r="45" fill="none" stroke="white" strokeWidth="5"/><path className="checkmark-check" d="M30 50 L45 65 L70 35" fill="none" stroke="white" strokeWidth="5" strokeLinecap="round" strokeLinejoin="round"/></svg><h1 className="text-white text-2xl font-bold mb-2">{message}</h1><p className="text-green-100">성공적으로 저장되었습니다</p></div></div>)}
function SelectField({label,value,onChange,options=[],placeholder,icon}){return(<div><label className="block text-sm font-medium text-gray-600 mb-1.5">{label}</label><div className="relative">{icon&&<div className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><Icon name={icon} size={18}/></div>}<select value={value} onChange={e=>onChange(e.target.value)} className={`w-full p-3 ${icon?'pl-10':''} bg-white border border-gray-200 rounded-xl text-gray-800 appearance-none cursor-pointer`}><option value="">{placeholder||'선택하세요'}</option>{(options||[]).map((o,i)=><option key={i} value={o}>{o}</option>)}</select><div className="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none"><Icon name="ChevronDown" size={18}/></div></div></div>)}
function InputField({label,value,onChange,placeholder,icon,type='text',multiline=false}){const cls=`w-full p-3 ${icon?'pl-10':''} bg-white border border-gray-200 rounded-xl text-gray-800`;return(<div><label className="block text-sm font-medium text-gray-600 mb-1.5">{label}</label><div className="relative">{icon&&<div className="absolute left-3 top-3.5 text-gray-400"><Icon name={icon} size={18}/></div>}{multiline?<textarea value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} className={cls} rows={3}/>:<input type={type} value={value} onChange={e=>onChange(e.target.value)} placeholder={placeholder} className={cls}/>}</div></div>)}
const validateKoreanName=(v)=>{const complete=v.replace(/[^가-힣]/g,'');return complete.length>=2&&complete.length<=4&&complete===v};
function KoreanNameField({label,value,onChange,placeholder,icon}){
  const composingRef=useRef(false);const[warn,setWarn]=useState('');
  const handleChange=(e)=>{const v=e.target.value;const filtered=v.replace(/[a-zA-Z0-9!@#$%^&*()_+=\[\]{};':"\\|,.<>\/?`~\-]/g,'');onChange(filtered);if(v!==filtered)setWarn('한글만 입력 가능합니다');else setWarn('')};
  const handleBlur=()=>{if(!value){setWarn('');return;}const complete=value.replace(/[^가-힣]/g,'');if(complete!==value)onChange(complete);if(complete.length>0&&complete.length<2)setWarn('2글자 이상 입력해주세요');else if(complete.length>4){onChange(complete.slice(0,4));setWarn('4글자까지 입력 가능합니다')}else setWarn('')};
  return(<div><label className="block text-sm font-medium text-gray-600 mb-1.5">{label}</label><div className="relative">{icon&&<div className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><Icon name={icon} size={18}/></div>}<input value={value} onChange={handleChange} onCompositionStart={()=>composingRef.current=true} onCompositionEnd={(e)=>{composingRef.current=false;handleChange(e)}} onBlur={handleBlur} placeholder={placeholder} maxLength={4} inputMode="text" className={`w-full p-3 ${icon?'pl-10':''} bg-white border ${warn?'border-red-300':'border-gray-200'} rounded-xl text-gray-800`}/></div>{warn&&<p className="text-xs text-red-500 mt-1">{warn}</p>}</div>)}
function SettingsPanel({settings,setSettings,fields}){const[ef,setEf]=useState(null);const[ni,setNi]=useState('');const cm={blue:{bg:'#eff6ff',text:'text-blue-600',btn:'bg-blue-600 hover:bg-blue-700'},emerald:{bg:'#ecfdf5',text:'text-emerald-600',btn:'bg-emerald-600 hover:bg-emerald-700'},amber:{bg:'#fffbeb',text:'text-amber-600',btn:'bg-amber-600 hover:bg-amber-700'}};const addI=(k)=>{if(!ni.trim())return;if(settings[k].includes(ni.trim())){alert('이미 존재합니다.');return;}setSettings({...settings,[k]:[...settings[k],ni.trim()]});setNi('');};const rmI=(k,idx)=>setSettings({...settings,[k]:settings[k].filter((_,i)=>i!==idx)});return(<div className="space-y-4 slide-up">{fields.map(f=>{const c=cm[f.color]||cm.blue;return(<div key={f.key} className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden"><button onClick={()=>{setEf(ef===f.key?null:f.key);setNi('');}} className="w-full p-4 flex items-center gap-3"><div className="w-10 h-10 rounded-xl flex items-center justify-center" style={{backgroundColor:c.bg}}><Icon name={f.icon} size={20} className={c.text}/></div><div className="text-left flex-1"><h3 className="font-bold text-gray-800 text-sm">{f.label}</h3><p className="text-xs text-gray-400">{settings[f.key].length}개 항목</p></div><Icon name={ef===f.key?"ChevronUp":"ChevronDown"} size={18} className="text-gray-400"/></button>{ef===f.key&&(<div className="border-t border-gray-100 p-4 fade-in"><div className="flex gap-2 mb-3"><input value={ni} onChange={e=>setNi(e.target.value)} onKeyDown={e=>e.key==='Enter'&&addI(f.key)} placeholder="새 항목 입력" className="flex-1 p-2.5 border border-gray-200 rounded-lg text-sm"/><button onClick={()=>addI(f.key)} className={`px-4 py-2 ${c.btn} text-white rounded-lg text-sm font-medium transition-colors`}>추가</button></div><div className="space-y-1.5">{settings[f.key].map((item,i)=>(<div key={i} className="flex items-center justify-between p-2.5 bg-gray-50 rounded-lg group"><span className="text-sm text-gray-700">{item}</span><button onClick={()=>rmI(f.key,i)} className="text-gray-300 hover:text-red-500 transition-colors"><Icon name="X" size={16}/></button></div>))}</div></div>)}</div>)})}</div>)}
function SubAppShell({title,icon,iconBg,accentClass,tabClass,onBack,tabs,activeTab,setActiveTab,children,emoji,gradient,accentColor}){
  const grd=gradient||'linear-gradient(135deg,#667eea,#764ba2)';
  const acc=accentColor||'#667eea';
  return(<div className="min-h-screen" style={{background:'#f0f4ff'}}>
    <header style={{background:grd,position:'sticky',top:0,zIndex:40,boxShadow:'0 4px 20px rgba(0,0,0,.1)'}}>
      <div className="max-w-lg mx-auto px-4 py-3 flex items-center gap-3">
        <button onClick={onBack} style={{color:'rgba(255,255,255,.7)',padding:'4px',background:'rgba(255,255,255,.15)',borderRadius:'10px',border:'none',cursor:'pointer',display:'flex',alignItems:'center',justifyContent:'center',width:'34px',height:'34px',transition:'all .2s'}}><Icon name="ArrowLeft" size={20}/></button>
        {emoji&&<span style={{fontSize:'24px'}}>{emoji}</span>}
        <h1 style={{fontSize:'16px',fontWeight:800,color:'#fff',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{title}</h1>
      </div>
    </header>
    <main className="max-w-lg mx-auto p-4 pb-24">{children}</main>
    <nav style={{position:'fixed',bottom:0,left:0,right:0,background:'#fff',borderTop:'1px solid #e5e7eb',boxShadow:'0 -4px 20px rgba(0,0,0,.05)',zIndex:40}}>
      <div className="max-w-lg mx-auto flex">
        {tabs.map(t=>(

closeDate} onChange={e=>u('closeDate',e.target.value)} className="w-full p-3 pl-10 bg-white border border-gray-200 rounded-xl text-gray-800"/></div></div><InputField label="Remark" value={f.remark} onChange={v=>u('remark',v)} placeholder="비고" icon="MessageSquare" multiline/>

          <div className="flex items-center gap-1.5"><div className="w-2 h-2 rounded-full bg-green-500"/><span className="text-xs text-gray-500">Closed <span className="font-bold text-green-600">{closedCnt}</span></span></div>
        </div>
        <div className="mt-2.5 w-full bg-gray-100 rounded-full h-2 overflow-hidden"><div className="h-full rounded-full bg-emerald-500 transition-all" style={{width:`${pct}%`}}/></div>
        </div>
        <Icon name="ChevronRight" size={18} className="text-gray-300"/></div>
      </button>)})}</div></div>);
  }

  // 3) Status grouped for selected dept+year
  const yearItems=deptItems.filter(it=>getYear(it)===selYear);
  const grouped={};yearItems.forEach(it=>{const st=it.status||'Open';if(!grouped[st])grouped[st]=[];grouped[st].push(it)});
  if(!selStatus)return(<div className="slide-in-right"><div className="flex items-center gap-2 mb-4"><button onClick={()=>{setSelYear(null)}} className="text-gray-400 hover:text-gray-600"><Icon name="ArrowLeft" size={20}/></button><h2 className="text-base font-bold text-gray-800">{selDept}</h2><span className="px-2 py-0.5 bg-indigo-100 text-indigo-700 rounded-full text-xs font-medium ml-1">{selYear}년</span><span className="text-xs text-gray-400 ml-1">{yearItems.length}건</span></div>
  <div className="space-y-3">{statusOrder.filter(st=>grouped[st]&&grouped[st].length>0).map((st,idx)=>{const c=sc(st);const cnt=grouped[st].length;
    return(<button key={st} onClick={()=>setSelStatus(st)} className="w-full bg-white rounded-2xl p-4 shadow-sm border border-gray-100 text-left card-hover slide-up" style={{animationDelay:`${idx*.04}s`}}>
      <div className="flex items-center gap-3"><div className={`w-10 h-10 ${c.bg} rounded-xl flex items-center justify-center`}><Icon name={c.icon} size={20} className={c.color}/></div>
      <div className="flex-1"><h3 className="font-bold text-gray-800 text-sm">{st}</h3></div>
      <span className={`px-3 py-1 rounded-full text-sm font-bold ${c.bg} ${c.text}`}>{cnt}</span>
      <Icon name="ChevronRight" size={18} className="text-gray-300"/></div>
    </button>)})}</div></div>);

  // 4) Item detail list
  const statusItems=grouped[selStatus]||[];const stc=sc(selStatus);
  return(<div className="slide-in-right"><div className="flex items-center gap-2 mb-4"><button onClick={()=>{setSelStatus(null);setEditId(null)}} className="text-gray-400 hover:text-gray-600"><Icon name="ArrowLeft" size={20}/></button><h2 className="text-base font-bold text-gray-800">{selDept}</h2><span className="px-2 py-0.5 bg-indigo-100 text-indigo-700 rounded-full text-xs font-medium">{selYear}년</span><span className={`px-2 py-0.5 rounded-full text-xs font-medium ${stc.bg} ${stc.text}`}>{selStatus}</span><span className="text-xs text-gray-400">{statusItems.length}건</span></div>
  <div className="space-y-3">{statusItems.map((item,idx)=>(<div key={item.id} className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden slide-up" style={{animationDelay:`${idx*.03}s`}}>
    <div className="p-4 cursor-pointer" onClick={()=>setEditId(editId===item.id?null:item.id)}>
      <div className="flex items-start justify-between mb-1.5"><span className="text-xs text-gray-400">{item.date}</span><Icon name={editId===item.id?"ChevronUp":"ChevronDown"} size={16} className="text-gray-400"/></div>
      <p className="text-sm font-medium text-gray-800 line-clamp-2 mb-2">{item.finding}</p>
      <div className="flex items-center gap-3 text-xs text-gray-500 flex-wrap">
        <span className="flex items-center gap-1"><Icon name="User" size={12}/>{item.name}</span>
        <span className="flex items-center gap-1"><Icon name="Box" size={12}/>{item.module}</span>
        {item.dueDate&&<span className="flex items-center gap-1"><Icon name="Calendar" size={12}/>Due: {item.dueDate}</span>}
      </div>
    </div>
    {editId===item.id&&(<div className="border-t border-gray-100 p-4 bg-gray-50 fade-in">
      <div className="grid grid-cols-3 gap-2 text-xs mb-3"><div className="bg-white rounded-lg p-2.5 border border-gray-100"><p className="text-gray-400 mb-0.5">이름</p><p className="font-medium text-gray-700">{item.name}</p></div><div className="bg-white rounded-lg p-2.5 border border-gray-100"><p className="text-gray-400 mb-0.5">Module</p><p className="font-medium text-gray-700">{item.module}</p></div><div className="bg-white rounded-lg p-2.5 border border-gray-100"><p className="text-gray-400 mb-0.5">Dept</p><p className="font-medium text-gray-700">{item.dept}</p></div></div>
      <div className="space-y-3">
        <InputField label="Finding" value={item.finding} onChange={v=>updateItem(item.id,{finding:v})} icon="FileText" multiline/>
        <InputField label="Action Item" value={item.actionItem||''} onChange={v=>updateItem(item.id,{actionItem:v})} icon="Wrench"/>
        <InputField label="Due Date" value={item.dueDate||''} onChange={v=>updateItem(item.id,{dueDate:v})} type="date" icon="Calendar"/>
        <div><label className="block text-sm font-medium text-gray-600 mb-1.5">Close Date <span className="text-xs text-emerald-600">(입력 시 자동 Closed)</span></label><div className="relative"><div className="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"><Icon name="CalendarCheck" size={18}/></div><input type="date" value={item.closeDate||''} onChange={e=>updateItem(item.id,{closeDate:e.target.value})} className="w-full p-3 pl-10 bg-white border border-gray-200 rounded-xl text-gray-800"/></div></div>
        <InputField label="Remark" value={item.remark||''} onChange={v=>updateItem(item.id,{remark:v})} icon="MessageSquare" multiline/>
      </div>
      <button onClick={()=>delItem(item.id)} className="mt-3 text-red-500 text-sm flex items-center gap-1 hover:text-red-700"><Icon name="Trash2" size={14}/> 삭제</button>
    </div>)}
  </div>))}</div></div>);
}

// ★ 배포 후 여기에 WRA GAS 웹앱 URL 입력 ★
const WRA_GAS_URL = 'https://script.google.com/macros/s/AKfycbxLlljY0p6mbz_FbRTXGg0RJkjFhpCaOgvXIdQk_vWH7NOQxxh6T6DahX172cvbUxuF1w/exec';

const normDate=(v)=>{if(!v)return '';const s=String(v).trim();if(s.length>10&&s.indexOf('T')>-1){const d=new Date(s);if(!isNaN(d)){const y=d.getUTCFullYear();const m=String(d.getUTCMonth()+1).padStart(2,'0');const day=String(d.getUTCDate()).padStart(2,'0');return`${y}-${m}-${day}`;}return s.substring(0,10);}return s;};
const normWRAItem=(it)=>{const ni={...it,dept:String(it.dept||''),line:String(it.line||''),no:String(it.no||''),station:String(it.station||''),initiateDate:normDate(it.initiateDate),prev2025:{plan:normDate(it.prev2025?.plan),rev:normDate(it.prev2025?.rev)}};if(ni.years){const yrs={};Object.keys(ni.years).forEach(yr=>{const yd={...ni.years[yr]};yd.plan=normDate(yd.plan);yd.rev=normDate(yd.rev);yd.wiSchedule=normDate(yd.wiSchedule);yd.uploadDate=normDate(yd.uploadDate);yrs[yr]=yd;});ni.years=yrs;}return ni;};

const wraApi={
  async get(type='all'){
    if(!WRA_GAS_URL)return null;
    try{const r=await fetch(WRA_GAS_URL+'?type='+type);return await r.json();}catch(e){console.error('WRA API get:',e);return null;}
  },
  async post(body){
    if(!WRA_GAS_URL)return null;
    try{const r=await fetch(WRA_GAS_URL,{method:'POST',body:JSON.stringify(body)});return await r.json();}catch(e){console.error('WRA API post:',e);return null;}
  }
};

function WRAApp({onBack}){
  const BASE=2026;const YEARS=[2026,2027,2028,2029,2030];
  const defaultWra={depts:['MFG','QM','ENG TCP','ENG FE','ME','SCM']};
  const[items,setItems]=useState(()=>{
    const raw=S.get('wra_items',[]);
    return raw.map(it=>{if(it.years)return it;return{...it,originYear:BASE,prev2025:{plan:it.review2025||'',rev:it.revision2025||''},years:{2026:{plan:it.review2026||'',rev:it.revision2026||'',excluded:false,wiChange:it.wiChange||'',wiSchedule:it.wiSchedule||'',remark:it.remark||'',fileName:it.fileName||'',fileData:it.fileData||'',uploadDate:''}}}});
  });
  const[settings,setSettings]=useState(()=>{const s=S.get('wra_settings',defaultWra);return{depts:s.depts||defaultWra.depts,emails:s.emails||{}}});
  const[selDept,setSelDept]=useState(null);
  const[selYear,setSelYear]=useState(BASE);
  const[showSettings,setShowSettings]=useState(false);
  const[synced,setSynced]=useState(!WRA_GAS_URL);
  const[syncing,setSyncing]=useState(false);
  const[lastSync,setLastSync]=useState(null);
  const[dirty,setDirty]=useState(false);
  const savedSnapshot=useRef({items:[],settings:{}});
  const scrollRef=useRef(null);

  // Google Sheets 초기 로드
  useEffect(()=>{
    if(!WRA_GAS_URL)return;
    (async()=>{
      setSyncing(true);
      try{
        const res=await wraApi.get('all');
        if(res&&res.success){
          if(res.items&&res.items.length>0){const ni=res.items.map(normWRAItem);setItems(ni);S.set('wra_items',ni);}
          if(res.settings){
            const s={depts:res.settings.depts||defaultWra.depts,emails:res.settings.emails||{}};
            setSettings(s);S.set('wra_settings',s);
          }
          savedSnapshot.current={items:JSON.parse(JSON.stringify(ni)),settings:JSON.parse(JSON.stringify(res.settings||{}))};
          setSynced(true);setLastSync(new Date());
        }
      }catch(e){console.error('WRA initial sync failed:',e);}
      finally{setSyncing(false);}
    })();
  },[]);

  // 적용 (Google에 저장)
  const applyChanges=async()=>{
    S.set('wra_items',items);S.set('wra_settings',settings);
    if(!WRA_GAS_URL){setDirty(false);return;}
    setSyncing(true);
    try{
      const cleanItems=items.map(it=>{
        const yrs={};
        if(it.years){Object.keys(it.years).forEach(yr=>{const yd={...it.years[yr]};delete yd.fileData;yrs[yr]=yd;});}
        return{...it,years:yrs};
      });
      const res=await wraApi.post({action:'saveAll',items:cleanItems,settings});
      if(res&&res.success){
        savedSnapshot.current={items:JSON.parse(JSON.stringify(items)),settings:JSON.parse(JSON.stringify(settings))};
        setSynced(true);setLastSync(new Date());setDirty(false);
      }else{alert('저장 실패. 다시 시도해주세요.');}
    }catch(e){console.error('WRA sync error:',e);alert('저장 중 오류가 발생했습니다.');}
    finally{setSyncing(false);}
  };

  // 취소 (마지막 저장 상태로 복원)
  const cancelChanges=()=>{
    if(!dirty)return;
    if(!confirm('수정한 내용을 취소하시겠습니까?'))return;
    if(WRA_GAS_URL&&savedSnapshot.current.items.length>0){
      setItems(JSON.parse(JSON.stringify(savedSnapshot.current.items)));
      const s=savedSnapshot.current.settings;
      setSettings({depts:s.depts||defaultWra.depts,emails:s.emails||{}});
    }else{
      setItems(S.get('wra_items',[]));
      setSettings(S.get('wra_settings',defaultWra));
    }
    setDirty(false);
  };

  const markDirty=()=>{setDirty(true);};
  const updateItem=(id,changes)=>{setItems(prev=>prev.map(it=>it.id===id?{...it,...changes}:it));markDirty()};
  const updateYD=(id,yr,changes)=>{setItems(prev=>prev.map(it=>{if(it.id!==id)return it;const yrs={...(it.years||{})};yrs[yr]={...(yrs[yr]||{}),...changes};return{...it,years:yrs}}));markDirty()};
  const getYD=(item,yr)=>item.years?.[yr]||{};
  const delItem=(id)=>{if(confirm('삭제하시겠습니까?')){setItems(prev=>prev.filter(it=>it.id!==id));markDirty();}};

  const isAll=selDept==='__ALL__';const deptLabel=isAll?'전체':selDept;
  // Get items visible in year
  const getItemsForYear=useCallback((yr)=>{
    const deptItems=isAll?items:items.filter(it=>it.dept===selDept);
    if(yr===BASE)return deptItems.filter(it=>(it.originYear||BASE)===BASE);
    const getR=(y)=>{
      if(y===BASE)return deptItems.filter(it=>(it.originYear||BASE)===BASE);
      const pp=getR(y-1);return[...pp.filter(it=>!getYD(it,y-1).excluded),...deptItems.filter(it=>it.originYear===y)];
    };
    return getR(yr);
  },[items,selDept]);

  const visibleItems=useMemo(()=>selDept?getItemsForYear(selYear):[],[items,selDept,selYear]);
  const sortedItems=useMemo(()=>[...visibleItems].sort((a,b)=>{if(isAll){const d=String(a.dept||'').localeCompare(String(b.dept||''));if(d!==0)return d;}const l=String(a.line||'').localeCompare(String(b.line||''));return l!==0?l:String(a.station||'').localeCompare(String(b.station||''))}),[visibleItems]);

  const addRow=()=>{setItems(prev=>[...prev,{id:Date.now(),dept:selDept,originYear:selYear,line:'',no:'',station:'',initiateDate:'',prev2025:{plan:'',rev:''},years:{}}]);markDirty();setTimeout(()=>{if(scrollRef.current)scrollRef.current.scrollTop=scrollRef.current.scrollHeight},50)};
  const canDelete=(item)=>selYear===BASE?true:item.originYear===selYear;

  const handleFile=(id,yr,e)=>{const file=e.target.files[0];if(!file){return;}if(file.size>2*1024*1024){alert('2MB 이하만 가능');e.target.value='';return;}const yd=getYD(items.find(it=>it.id===id),yr);if(yd.fileName){if(!confirm('기존파일을 삭제하고 덮어씌웁니다. 진행하겠습니까?')){e.target.value='';return;}}const r=new FileReader();r.onload=async()=>{
    if(WRA_GAS_URL){
      // Google Drive에 업로드
      try{
        const res=await wraApi.post({action:'uploadFile',itemId:id,year:yr,fileName:file.name,fileData:r.result,mimeType:file.type||'application/octet-stream'});
        if(res&&res.success){
          // 기존 파일 삭제
          if(yd.driveFileId){await wraApi.post({action:'deleteFile',fileId:yd.driveFileId}).catch(()=>{});}
          updateYD(id,yr,{fileName:res.fileName,driveFileId:res.fileId,fileData:'',uploadDate:res.uploadDate||toLocalDate(new Date())});
        }else{alert('파일 업로드 실패');updateYD(id,yr,{fileName:file.name,fileData:r.result,uploadDate:toLocalDate(new Date())});}
      }catch(err){console.error('File upload error:',err);updateYD(id,yr,{fileName:file.name,fileData:r.result,uploadDate:toLocalDate(new Date())});}
    }else{
      updateYD(id,yr,{fileName:file.name,fileData:r.result,uploadDate:toLocalDate(new Date())});
    }
    e.target.value='';
  };r.readAsDataURL(file)};
  const downloadFile=async(item,yr)=>{const yd=getYD(item,yr);
    if(yd.driveFileId&&WRA_GAS_URL){
      // Google Drive에서 다운로드
      try{
        const res=await wraApi.get('file&fileId='+yd.driveFileId);
        if(res&&res.success&&res.data){const a=document.createElement('a');a.href=res.data.data;a.download=yd.fileName||res.data.fileName||'file';a.click();return;}
      }catch(e){console.error('File download error:',e);}
    }
    if(yd.fileData){const a=document.createElement('a');a.href=yd.fileData;a.download=yd.fileName||'file';a.click();}
    else{alert('파일을 찾을 수 없습니다.');}
  };
  const removeFile=async(id,yr)=>{if(!confirm('영구삭제됩니다. 삭제하겠습니까?'))return;
    const yd=getYD(items.find(it=>it.id===id),yr);
    if(yd.driveFileId&&WRA_GAS_URL){await wraApi.post({action:'deleteFile',fileId:yd.driveFileId}).catch(()=>{});}
    updateYD(id,yr,{fileName:'',fileData:'',driveFileId:'',uploadDate:''});
  };

  // Excel export
  const exportExcel=()=>{
    const rows=[];let num=0;let prevDp='';
    sortedItems.forEach(item=>{
      const yd=getYD(item,selYear);const excl=!!yd.excluded;
      if(isAll&&item.dept!==prevDp){num=0;prevDp=item.dept;}
      if(!excl)num++;
      const prevYD=isBase?null:getYD(item,selYear-1);
      const row={'#':excl?'':num};
      if(isAll)row['Dept']=item.dept;
      row['Line']=item.line||'';row['No']=item.no||'';row['Station']=item.station||'';row['Initiate Date']=item.initiateDate||'';
      if(isBase){row['2025 Plan']=item.prev2025?.plan||'';row['2025 Rev']=item.prev2025?.rev||'';}
      else{row[`${selYear-1} Plan`]=prevYD?.excluded?'해당없음':prevYD?.plan||'';row[`${selYear-1} Rev`]=prevYD?.rev||'';}
      row[`${selYear} Plan`]=excl?'해당없음':yd.plan||'';row[`${selYear} Rev`]=excl?'':yd.rev||'';
      row['WI 변경']=excl?'':yd.wiChange||'';row['WI 일정']=excl?'':yd.wiSchedule||'';
      row['Remark']=excl?'':yd.remark||'';row['업로드 일자']=excl?'':yd.uploadDate||'';
      rows.push(row);
    });
    const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'WRA');
    XLSX.writeFile(wb,`WRA_${deptLabel}_${selYear}.xlsx`);
  };

  // Zip download all files
  const downloadAllFiles=async()=>{
    const files=sortedItems.filter(it=>{const yd=getYD(it,selYear);return (yd.fileData||yd.driveFileId)&&yd.fileName});
    if(!files.length){alert('첨부된 파일이 없습니다.');return;}
    const zip=new JSZip();
    const names={};
    for(const it of files){
      const yd=getYD(it,selYear);
      let fn=`${it.dept||'DEPT'}_${it.line||'LINE'}_${it.station||'STATION'}_${yd.fileName}`;
      if(names[fn]){names[fn]++;fn=fn.replace(/(\.[^.]+)$/,`_${names[fn]}$1`);}else{names[fn]=1;}
      let b64='';
      if(yd.driveFileId&&WRA_GAS_URL){
        try{const res=await wraApi.get('file&fileId='+yd.driveFileId);if(res&&res.success&&res.data){b64=res.data.data.split(',')[1]||'';}}catch(e){console.error('Drive file fetch:',e);}
      }
      if(!b64&&yd.fileData){b64=yd.fileData.split(',')[1];}
      if(b64)zip.file(fn,b64,{base64:true});
    }
    const blob=await zip.generateAsync({type:'blob'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=`WRA_${deptLabel}_${selYear}_files.zip`;a.click();URL.revokeObjectURL(a.href);
  };
  // Dept count helpers
  const depts=useMemo(()=>{const d={};items.forEach(it=>{const dept=it.dept||'미지정';if(!d[dept])d[dept]=[];d[dept].push(it)});return d},[items]);

  const updateEmail=(dept,field,val)=>{setSettings(prev=>({...prev,emails:{...prev.emails,[dept]:{...(prev.emails[dept]||{}),  [field]:val}}}));markDirty()};
  const getEmail=(dept,field)=>(settings.emails?.[dept]?.[field])||'';

  // D-day helpers: check Plan date, only alert if Rev not completed
  const getDStatus=(planDate,revDate)=>{if(!planDate||revDate)return null;const today=new Date();today.setHours(0,0,0,0);const plan=new Date(planDate);const diff=Math.ceil((plan-today)/(1000*60*60*24));if(diff<0)return{type:'overdue',days:Math.abs(diff),label:`${Math.abs(diff)}일 초과`,color:'#ef4444'};if(diff<=7)return{type:'soon',days:diff,label:`D-${diff}`,color:'#f59e0b'};return null};

  // Send mail
  const sendNotifyMail=(dept,itemList,type)=>{
    const toKey=type==='overdue'?'overdueTo':'soonTo';const ccKey=type==='overdue'?'overdueCc':'soonCc';
    const to=getEmail(dept,toKey);const cc=getEmail(dept,ccKey);
    if(!to){alert(`${dept} ${type==='overdue'?'기한 초과':'기한 임박'} 이메일이 설정되지 않았습니다.`);return;}

// ===== TableScaler =====
function TableScaler({children}){
  const wrapRef=useRef(null);const tblRef=useRef(null);const[style,setStyle]=useState({});
  useEffect(()=>{
    const calc=()=>{
      const w=wrapRef.current,t=tblRef.current;if(!w||!t)return;
      // reset to measure natural size
      t.style.transform='none';t.style.transformOrigin='top left';
      const tw=t.scrollWidth,th=t.scrollHeight,cw=w.clientWidth;
      if(tw>cw){const sc=cw/tw;setStyle({transform:`scale(${sc})`,transformOrigin:'top left',width:tw+'px',height:th+'px',marginBottom:`${th*(sc-1)}px`})}
      else{setStyle({})}
    };
    const t1=setTimeout(calc,50);const t2=setTimeout(calc,200);
    window.addEventListener('resize',calc);
    return()=>{clearTimeout(t1);clearTimeout(t2);window.removeEventListener('resize',calc)};
  },[]);
  return(<div ref={wrapRef} style={{flex:1,overflowY:'auto',overflowX:'hidden'}}><div ref={tblRef} style={{width:'max-content',...style}}>{children}</div></div>);
}

function ProductManager({products,setProducts}){
  const[name,setName]=useState('');
  const[points,setPoints]=useState('');
  const[photo,setPhoto]=useState('');
  const[editId,setEditId]=useState(null);

  const handlePhoto=(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>setPhoto(ev.target.result);
    reader.readAsDataURL(file);
  };

  const save=()=>{
    if(!name.trim()||!points){alert('상품명과 포인트를 입력해주세요.');return;}
    if(editId){
      setProducts(products.map(p=>p.id===editId?{...p,name:name.trim(),points:Number(points),photo}:p));
      ciApi.post({action:'updateProduct',id:editId,name:name.trim(),points:Number(points),photo}).then(res=>{
        if(res&&res.photo!==undefined)setProducts(prev=>prev.map(p=>p.id===editId?{...p,photo:res.photo}:p));
      });
      setEditId(null);
    }else{
      const newId=Date.now().toString();
      setProducts([...products,{id:newId,name:name.trim(),points:Number(points),photo}]);
      ciApi.post({action:'addProduct',name:name.trim(),points:Number(points),photo}).then(res=>{
        if(res&&res.id)setProducts(prev=>prev.map(p=>p.id===newId?{...p,id:res.id,photo:res.photo||p.photo}:p));
      });
    }
    setName('');setPoints('');setPhoto('');
  };

  const edit=(p)=>{setEditId(p.id);setName(p.name);setPoints(String(p.points));setPhoto(p.photo||'');};
  const del=(id)=>{if(confirm('삭제?')){setProducts(products.filter(p=>p.id!==id));ciApi.post({action:'deleteProduct',id})}};

  return(<div>
    <div style={{display:'flex',gap:'8px',marginBottom:'10px',flexWrap:'wrap'}}>

      <button onClick={save} style={{padding:'8px 14px',background:editId?'#f59e0b':'#2563eb',color:'#fff',border:'none',borderRadius:'8px',fontSize:'12px',fontWeight:700,cursor:'pointer'}}>{editId?'수정':'등록'}</button>

function DiceGame({personName,personDept,played,diceKey,entries,setEntries}){
  const[dice1,setDice1]=useState(0);
  const[dice2,setDice2]=useState(0);
  const[rolling,setRolling]=useState(false);
  const[result,setResult]=useState(null); // {sum, reward, msg}
  const[hasPlayed,setHasPlayed]=useState(played);

  const REWARDS={2:{points:10,msg:'🎉 더블1! 잭팟 10P!',color:'#fbbf24'},3:{points:3,msg:'🎲 3 나왔다! +3P',color:'#34d399'},7:{points:5,msg:'🍀 럭키세븐! +5P',color:'#60a5fa'},11:{points:3,msg:'🎲 11 나왔다! +3P',color:'#34d399'},12:{points:10,msg:'🎉 더블6! 잭팟 10P!',color:'#fbbf24'}};
  const DOUBLES={1:5,2:3,3:2,4:2,5:3,6:5}; // 같은 눈 보너스

  const rollDice=()=>{
    if(hasPlayed||rolling)return;
    setRolling(true);setResult(null);
    let count=0;
    const interval=setInterval(()=>{
      setDice1(Math.floor(Math.random()*6)+1);
      setDice2(Math.floor(Math.random()*6)+1);
      count++;
      if(count>=15){
        clearInterval(interval);
        const d1=Math.floor(Math.random()*6)+1;
        const d2=Math.floor(Math.random()*6)+1;
        setDice1(d1);setDice2(d2);
        const sum=d1+d2;
        let reward=0;let msg='';
        if(d1===d2){
          reward=DOUBLES[d1]||2;
          msg=d1===1?'🎉 더블1! 잭팟 '+reward+'P!':d1===6?'🎉 더블6! 잭팟 '+reward+'P!':'✨ 더블! +'+reward+'P!';
        }else if(sum===7){
          reward=5;msg='🍀 럭키세븐! +5P';
        }else{
          reward=0;msg='😅 아쉽게 꽝! 내일 다시 도전!';
        }
        setResult({sum,reward,msg,d1,d2});
        S.set(diceKey,true);
        setHasPlayed(true);
        setRolling(false);

        // 포인트 적립은 결과를 보여준 후 지연 처리
        if(reward>0){
          setTimeout(()=>{
            const now=kstToday();
            const newEntry={id:Date.now().toString()+'_dice',name:personName,dept:personDept,category:'주사위게임',score:reward,date:now,memo:`주사위 [${d1}+${d2}=${sum}]`};
            setEntries(prev=>[...prev,newEntry]);
            ciApi.post({action:'addPoint',...newEntry});
          },2500);
        }
      }
    },80);
  };

  const DICE_FACE=(n)=>{
    const dots={1:[[1,1]],2:[[0,2],[2,0]],3:[[0,2],[1,1],[2,0]],4:[[0,0],[0,2],[2,0],[2,2]],5:[[0,0],[0,2],[1,1],[2,0],[2,2]],6:[[0,0],[0,2],[1,0],[1,2],[2,0],[2,2]]};
    return(<div style={{width:'64px',height:'64px',background:rolling?'#fff':'#fff',borderRadius:'12px',display:'grid',gridTemplateColumns:'repeat(3,1fr)',gridTemplateRows:'repeat(3,1fr)',padding:'10px',boxShadow:rolling?'0 0 20px rgba(139,92,246,.5)':'0 4px 12px rgba(0,0,0,.2)',transform:rolling?`rotate(${Math.random()*30-15}deg)`:'none',transition:'transform .08s'}}>
      {[0,1,2].map(r=>[0,1,2].map(c=>{
        const hasDot=n>0&&(dots[n]||[]).some(([dr,dc])=>dr===r&&dc===c);
        return(<div key={r+'-'+c} style={{display:'flex',alignItems:'center',justifyContent:'center'}}>
          {hasDot&&<div style={{width:'10px',height:'10px',borderRadius:'50%',background:'#312e81'}}/>}
        </div>);
      }))}
    </div>);
  };

  return(<div>
    <div style={{fontSize:'24px',marginBottom:'8px'}}>🎲 주사위 포인트 게임</div>
    <p style={{fontSize:'11px',color:'#a5b4fc',marginBottom:'16px'}}>더블 또는 럭키세븐(7)이 나오면 보너스!</p>

    {/* Rules */}
    <div style={{background:'rgba(255,255,255,.08)',borderRadius:'10px',padding:'10px',marginBottom:'16px',fontSize:'10px',color:'#c4b5fd',textAlign:'left',lineHeight:1.6}}>
      🎯 럭키세븐(7): <span style={{color:'#60a5fa',fontWeight:700}}>+5P</span><br/>
      🎲 더블: <span style={{color:'#34d399',fontWeight:700}}>+2~5P</span><br/>
      🎉 더블1 / 더블6: <span style={{color:'#fbbf24',fontWeight:700}}>+5P 잭팟!</span><br/>
      ⏰ 하루 1회 무료
    </div>

    {/* Dice */}
    <div style={{display:'flex',justifyContent:'center',gap:'16px',marginBottom:'20px'}}>
      {DICE_FACE(dice1||1)}
      {DICE_FACE(dice2||1)}
    </div>

    {/* Result */}
    {result&&(
      <div className="pop-in" style={{marginBottom:'16px',padding:'12px',borderRadius:'12px',background:result.reward>0?'rgba(52,211,153,.15)':'rgba(255,255,255,.08)'}}>
        <div style={{fontSize:'28px',fontWeight:900,marginBottom:'4px',color:result.reward>0?'#fbbf24':'#94a3b8'}}>{result.d1} + {result.d2} = {result.sum}</div>
        <div style={{fontSize:'14px',fontWeight:700,color:result.reward>0?'#34d399':'#94a3b8'}}>{result.msg}</div>
      </div>
    )}

    {/* Button */}
    {!hasPlayed?(
      <button onClick={rollDice} disabled={rolling} style={{width:'100%',padding:'14px',background:rolling?'rgba(255,255,255,.1)':'linear-gradient(135deg,#8b5cf6,#a855f7)',color:'#fff',border:'none',borderRadius:'12px',fontSize:'15px',fontWeight:800,cursor:rolling?'wait':'pointer',boxShadow:rolling?'none':'0 4px 16px rgba(139,92,246,.4)',transition:'all .2s'}}>
        {rolling?'🎲 굴리는 중...':'🎲 주사위 굴리기!'}
      </button>
    ):(
      <div style={{padding:'10px',background:'rgba(255,255,255,.05)',borderRadius:'10px',fontSize:'12px',color:'#94a3b8'}}>
        ✅ 오늘의 게임을 이미 했습니다. 내일 다시 도전하세요!
      </div>
    )}
  </div>);
}

  useEffect(()=>{
    if(!CI_GAS_URL)return;

      if(res&&res.success){
        if(res.points&&res.points.length>0)setEntries(res.points);
        if(res.products&&res.products.length>0)setProducts(res.products);
        if(res.exchanges&&res.exchanges.length>0)setExchangeHistory(res.exchanges);
        if(res.categories&&res.categories.length>0)setCategories(res.categories);
        if(res.departments&&res.departments.length>0)setDepartments(res.departments);

      }
      setLoading(false);
    });
  },[]);

  const catColors=['#3b82f6','#8b5cf6','#06b6d4','#0891b2','#f59e0b','#10b981','#22c55e','#e879f9','#6366f1','#14b8a6','#ec4899','#f97316','#84cc16','#64748b'];
  const getCatColor=(i)=>catColors[i%catColors.length];

  // Products
  const[products,setProducts]=useState(()=>S.get('ci_products',[]));
  const[exchangeHistory,setExchangeHistory]=useState(()=>S.get('ci_exchange_history',[]));
  useEffect(()=>{S.set('ci_products',products)},[products]);
  useEffect(()=>{S.set('ci_exchange_history',exchangeHistory)},[exchangeHistory]);

  // Filtered entries by year
  const yearEntries=useMemo(()=>entries.filter(e=>{
    if(!e.date)return false;
    const m=e.date.match(/(\d{4})/);
    return m&&parseInt(m[1])===year;
  }),[entries,year]);

  // Aggregate per person
  const rankings=useMemo(()=>{
    const map={};
    yearEntries.forEach(e=>{
      const key=e.name;
      if(!map[key])map[key]={name:e.name,dept:e.dept||'',totals:{},exchange:0};
      if(e.category==='교환'){
        map[key].exchange+=Math.abs(Number(e.score)||0);
      }else if(e.category==='교환취소'){
        map[key].exchange-=Math.abs(Number(e.score)||0);
      }else{
        if(!map[key].totals[e.category])map[key].totals[e.category]=0;
        map[key].totals[e.category]+=Number(e.score)||0;
      }
      if(e.dept)map[key].dept=e.dept;
    });
    return Object.values(map).map(p=>{
      p.exchange=Math.max(0,p.exchange);
      const gross=Object.values(p.totals).reduce((a,b)=>a+b,0);
      return{...p,gross,total:gross-p.exchange};
    }).sort((a,b)=>b.gross-a.gross);
  },[yearEntries]);

  const top30=rankings.slice(0,30);

  const[editId,setEditId]=useState(null);

  const addEntry=()=>{
    if(!formName.trim()||!formCat||!formScore){alert('이름, 카테고리, 점수를 입력해주세요.');return;}
    const item={name:formName.trim(),dept:formDept,category:formCat,score:Number(formScore),date:formDate,memo:formMemo};
    if(editId){
      setEntries(entries.map(e=>e.id===editId?{...e,...item}:e));
      ciApi.post({action:'updatePoint',id:editId,...item});
      setEditId(null);
    }else{
      const newId=Date.now().toString();
      setEntries([...entries,{id:newId,...item}]);
      ciApi.post({action:'addPoint',...item}).then(res=>{if(res&&res.id)setEntries(prev=>prev.map(e=>e.id===newId?{...e,id:res.id}:e))});
    }
    setFormName('');setFormScore('');setFormMemo('');
  };
  const editEntry=(e)=>{setEditId(e.id);setFormName(e.name);setFormDept(e.dept||'');setFormCat(e.category);setFormScore(String(e.score));setFormDate(e.date);setFormMemo(e.memo||'');setActiveTab('manage');};
  const delEntry=(id)=>{if(confirm('삭제하시겠습니까?')){setEntries(entries.filter(e=>e.id!==id));ciApi.post({action:'deletePoint',id})}};

  // === 교환 승인/취소 (관리자) ===
  const approveExchange=(h)=>{
    if(!confirm(`${h.name}님에게 "${h.product}" 지급완료 하시겠습니까?`))return;
    setExchangeHistory(prev=>prev.map(ex=>ex.id===h.id?{...ex,status:'완료'}:ex));
    ciApi.post({action:'approveExchange',id:h.id});
  };
  const cancelExchange=(h)=>{
    if(!confirm(`${h.name}님의 "${h.product}" 교환을 취소하시겠습니까?\n포인트가 환불됩니다.`))return;
    const now=kstToday();
    setExchangeHistory(prev=>prev.filter(ex=>ex.id!==h.id));
    // 포인트 환불
    setEntries(prev=>[...prev,{id:Date.now().toString(),name:h.name,dept:h.dept,category:'교환취소',score:h.points,date:now,memo:`교환취소: ${h.product}`}]);
    ciApi.post({action:'cancelExchange',id:h.id});
  };
  // === Excel Import ===
  const PIVOT_CATS=['Level 1','Level 2','Level 3(RIE)','Level 4(VSM)','SIO','SP','5S+','RIE Leader','Six Sigma','Ss Leader','CFT/TFT','Champion','Licence'];
  const normH=(s)=>String(s||'').replace(/[\s\r\n]+/g,' ').replace(/[,\/]/g,'').trim().toLowerCase();
  const handleExcel=(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const wb=XLSX.read(ev.target.result,{type:'binary'});
        const sheetName=wb.SheetNames.find(s=>s.toLowerCase().includes('total'))||wb.SheetNames[0];
        const ws=wb.Sheets[sheetName];
        const raw=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        
        // 헤더 행 찾기
        let headerRow=-1;
        for(let i=0;i<Math.min(10,raw.length);i++){
          const row=raw[i].map(c=>normH(c));
          if(row.includes('부서')&&row.includes('이름')){headerRow=i;break;}
        }
        
        const newEntries=[];
        const ts=Date.now();
        const today=kstToday();
        
        if(headerRow>=0){
          // ★ 피벗 형식
          const headers=raw[headerRow].map(c=>String(c||'').replace(/[\r\n]+/g,' ').trim());
          const headersNorm=headers.map(h=>normH(h));
          const deptIdx=headersNorm.indexOf('부서');
          const nameIdx=headersNorm.indexOf('이름');
          
          // 카테고리 컬럼 매핑 (유연한 매칭)
          const catCols=[];
          PIVOT_CATS.forEach(cat=>{
            const cn=normH(cat);
            let idx=headersNorm.findIndex(h=>h===cn);
            // 부분 매칭 시도
            if(idx<0)idx=headersNorm.findIndex(h=>h.includes(cn)||cn.includes(h));
            // 특수 케이스: "CFT, TFT" or "CFT/TFT" or "CFT  TFT"
            if(idx<0&&cat==='CFT/TFT')idx=headersNorm.findIndex(h=>h.includes('cft')&&h.includes('tft'));
            if(idx<0&&cat==='Level 3(RIE)')idx=headersNorm.findIndex(h=>h.includes('level 3')&&h.includes('rie'));
            if(idx<0&&cat==='Level 4(VSM)')idx=headersNorm.findIndex(h=>h.includes('level 4')&&h.includes('vsm'));
            if(idx<0&&cat==='RIE Leader')idx=headersNorm.findIndex(h=>h.includes('rie')&&h.includes('leader'));
            if(idx<0&&cat==='Ss Leader')idx=headersNorm.findIndex(h=>h.includes('ss')&&h.includes('leader'));
            if(idx<0&&cat==='Six Sigma')idx=headersNorm.findIndex(h=>h.includes('six')&&h.includes('sigma'));
            if(idx>=0)catCols.push({cat,idx});
          });
          
          // 교환 컬럼
          const exchIdx=headersNorm.findIndex(h=>h==='교환');
          
          console.log('Headers found:',headers);
          console.log('Cat columns mapped:',catCols.map(c=>c.cat+' → col '+c.idx));
          
          for(let i=headerRow+1;i<raw.length;i++){
            const row=raw[i];
            const name=String(row[nameIdx]||'').trim();
            const dept=String(row[deptIdx]||'').trim();
            if(!name)continue;
            
            catCols.forEach(({cat,idx})=>{
              const val=Number(row[idx])||0;
              if(val>0){
                newEntries.push({id:''+ts+'_'+newEntries.length,name,dept,category:cat,score:val,date:today,memo:''});
              }
            });
            if(exchIdx>=0){
              const exchVal=Number(row[exchIdx])||0;
              if(exchVal!==0){
                newEntries.push({id:''+ts+'_'+newEntries.length,name,dept,category:'교환',score:exchVal<0?exchVal:-exchVal,date:today,memo:'포인트 교환'});
              }
            }
          }
        }else{
          // ★ 플랫 형식
          const data=XLSX.utils.sheet_to_json(ws);
          data.forEach((row,i)=>{
            const name=String(row['이름']||row['name']||'').trim();
            const cat=String(row['카테고리']||row['category']||'').trim();
            if(!name||!cat)return;
            newEntries.push({
              id:''+ts+'_'+i,name,
              dept:String(row['부서']||row['dept']||''),
              category:cat,
              score:Number(row['점수']||row['score'])||0,
              date:String(row['날짜']||row['date']||today),
              memo:String(row['메모']||row['memo']||'')
            });
          });
        }
        
        if(newEntries.length===0){alert('가져올 데이터가 없습니다.\n엑셀 헤더에 "부서"와 "이름" 컬럼이 있는지 확인해주세요.');return;}
        setEntries(prev=>[...prev,...newEntries]);
        ciApi.post({action:'addPoints',items:newEntries});
        alert(`✅ ${newEntries.length}건 가져왔습니다!`);
      }catch(err){alert('파일 읽기 오류: '+err.message);}
    };
    reader.readAsBinaryString(file);
    e.target.value='';
  };

  // === Settings Modal ===
  const[newCat,setNewCat]=useState('');
  const[newDept,setNewDept]=useState('');

  const settingsModal=showSettings&&(
    <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',zIndex:100,display:'flex',alignItems:'center',justifyContent:'center',padding:'16px'}} onClick={e=>{if(e.target===e.currentTarget)setShowSettings(false)}}>
      <div style={{background:'#fff',borderRadius:'16px',maxWidth:'500px',width:'100%',maxHeight:'90vh',overflow:'auto',padding:'20px',boxShadow:'0 20px 60px rgba(0,0,0,0.3)'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'16px'}}>
          <h2 style={{fontSize:'16px',fontWeight:700,margin:0}}>⚙️ CI Point 설정</h2>
          <button onClick={()=>setShowSettings(false)} style={{background:'none',border:'none',cursor:'pointer'}}><Icon name="X" size={20}/></button>
        </div>

        <div style={{marginBottom:'20px'}}>
          <h3 style={{fontSize:'13px',fontWeight:700,color:'#2563eb',marginBottom:'8px'}}>카테고리 관리</h3>
          <div style={{display:'flex',flexWrap:'wrap',gap:'6px',marginBottom:'8px'}}>
            {categories.map((c,i)=>(
              <span key={i} style={{display:'inline-flex',alignItems:'center',gap:'4px',padding:'4px 10px',borderRadius:'20px',fontSize:'12px',fontWeight:600,background:getCatColor(i)+'20',color:getCatColor(i),border:`1px solid ${getCatColor(i)}40`}}>
                <span style={{width:'8px',height:'8px',borderRadius:'50%',background:getCatColor(i)}}/>
                {c}
                <button onClick={()=>{if(confirm(`"${c}" 삭제?`))setCategories(categories.filter((_,j)=>j!==i))}} style={{background:'none',border:'none',cursor:'pointer',color:'#999',fontSize:'14px',lineHeight:1}}>×</button>
              </span>
            ))}
          </div>
          <div style={{display:'flex',gap:'6px'}}>
            <input value={newCat} onChange={e=>setNewCat(e.target.value)} placeholder="새 카테고리" style={{flex:1,padding:'6px 10px',border:'1px solid #ddd',borderRadius:'8px',fontSize:'13px'}} onKeyDown={e=>{if(e.key==='Enter'&&newCat.trim()){setCategories([...categories,newCat.trim()]);setNewCat('')}}}/>
            <button onClick={()=>{if(newCat.trim()){setCategories([...categories,newCat.trim()]);setNewCat('')}}} style={{padding:'6px 14px',background:'#2563eb',color:'#fff',border:'none',borderRadius:'8px',fontSize:'12px',fontWeight:600,cursor:'pointer'}}>추가</button>
          </div>
        </div>

        <div style={{marginBottom:'20px'}}>
          <h3 style={{fontSize:'13px',fontWeight:700,color:'#10b981',marginBottom:'8px'}}>부서 관리</h3>
          <div style={{display:'flex',flexWrap:'wrap',gap:'6px',marginBottom:'8px'}}>
            {departments.map((d,i)=>(
              <span key={i} style={{display:'inline-flex',alignItems:'center',gap:'4px',padding:'4px 10px',borderRadius:'20px',fontSize:'12px',fontWeight:600,background:'#f0fdf4',color:'#166534',border:'1px solid #bbf7d0'}}>
                {d}
                <button onClick={()=>setDepartments(departments.filter((_,j)=>j!==i))} style={{background:'none',border:'none',cursor:'pointer',color:'#999',fontSize:'14px',lineHeight:1}}>×</button>
              </span>
            ))}
          </div>
          <div style={{display:'flex',gap:'6px'}}>
            <input value={newDept} onChange={e=>setNewDept(e.target.value)} placeholder="새 부서" style={{flex:1,padding:'6px 10px',border:'1px solid #ddd',borderRadius:'8px',fontSize:'13px'}} onKeyDown={e=>{if(e.key==='Enter'&&newDept.trim()){setDepartments([...departments,newDept.trim()]);setNewDept('')}}}/>
            <button onClick={()=>{if(newDept.trim()){setDepartments([...departments,newDept.trim()]);setNewDept('')}}} style={{padding:'6px 14px',background:'#10b981',color:'#fff',border:'none',borderRadius:'8px',fontSize:'12px',fontWeight:600,cursor:'pointer'}}>추가</button>
          </div>
        </div>

        <div style={{padding:'12px',background:'#fef3c7',borderRadius:'8px',border:'1px solid #fbbf24'}}>
          <h3 style={{fontSize:'12px',fontWeight:700,color:'#92400e',marginBottom:'4px'}}>데이터 초기화</h3>
          <button onClick={()=>{if(confirm('모든 CI Point 데이터를 삭제하시겠습니까?')){setEntries([]);alert('초기화 완료')}}} style={{padding:'6px 14px',background:'#ef4444',color:'#fff',border:'none',borderRadius:'8px',fontSize:'12px',fontWeight:600,cursor:'pointer'}}>전체 데이터 삭제</button>
        </div>

        <button onClick={()=>setShowSettings(false)} style={{marginTop:'16px',width:'100%',padding:'10px',background:'#2563eb',color:'#fff',border:'none',borderRadius:'8px',fontWeight:700,fontSize:'14px',cursor:'pointer'}}>닫기</button>
      </div>
    </div>
  );

  // === DASHBOARD ===
  const Dashboard=()=>{

    const[showCriteria,setShowCriteria]=useState(false);
    const[showAll,setShowAll]=useState(false);
    const[showShop,setShowShop]=useState(null); // person name for shop
    const[showDice,setShowDice]=useState(null); // person name for dice game
    const selData=selPerson?rankings.find(r=>r.name===selPerson):null;

    const handleExchange=(product)=>{
      const person=rankings.find(r=>r.name===showShop);
      if(!person)return;
      if(person.total<product.points){alert('포인트가 부족합니다.');return;}
      if(!confirm(`${person.name}님이 "${product.name}" (${product.points}P) 교환을 신청하시겠습니까?`))return;
      const now=kstToday();
      const newId=Date.now().toString();
      // 포인트 즉시 차감
      setEntries(prev=>[...prev,{id:newId+'_ex',name:person.name,dept:person.dept,category:'교환',score:-product.points,date:now,memo:`상품교환: ${product.name}`}]);
      // 신청 내역 추가
      setExchangeHistory(prev=>[...prev,{id:newId,name:person.name,dept:person.dept,product:product.name,points:product.points,date:now,status:'신청'}]);
      ciApi.post({action:'exchange',name:person.name,dept:person.dept,product:product.name,points:product.points}).then(res=>{
        if(res&&res.id)setExchangeHistory(prev=>prev.map(h=>h.id===newId?{...h,id:res.id}:h));
      });
      alert(`교환 신청 완료! 포인트가 차감되었습니다.\n관리자가 상품 지급 후 완료 처리합니다.`);
      setShowShop(null);setSelPerson(null);
    };
    return(
    <div style={{padding:'16px',overflow:'auto'}}>
      {/* Year selector */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'16px'}}>
        <div style={{display:'flex',alignItems:'center',gap:'8px'}}>
          <h2 style={{fontSize:'18px',fontWeight:800,margin:0}}>🏆 CI Point Top 30</h2>
          <button onClick={()=>setShowCriteria(true)} style={{background:'linear-gradient(135deg,#f59e0b,#f97316)',border:'none',cursor:'pointer',color:'#fff',padding:'4px 12px',borderRadius:'8px',fontSize:'11px',fontWeight:700,boxShadow:'0 2px 6px rgba(245,158,11,.3)',whiteSpace:'nowrap'}}>지급 기준</button>
        </div>
        <select value={year} onChange={e=>setYear(Number(e.target.value))} style={{padding:'6px 12px',borderRadius:'8px',border:'1px solid #ddd',fontSize:'13px',fontWeight:600}}>
          {[2026,2027,2028].map(y=>(<option key={y} value={y}>{y}년</option>))}
        </select>
      </div>

      {/* Criteria Modal */}
      {showCriteria&&(
        <div onClick={()=>setShowCriteria(false)} style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.5)',zIndex:100,display:'flex',alignItems:'center',justifyContent:'center',padding:'12px',animation:'fadeIn .15s ease'}}>
          <div onClick={e=>e.stopPropagation()} style={{background:'#fff',borderRadius:'16px',maxWidth:'560px',width:'100%',maxHeight:'90vh',overflow:'auto',boxShadow:'0 20px 60px rgba(0,0,0,.3)',animation:'popIn .25s ease-out'}}>
            <div style={{position:'sticky',top:0,background:'linear-gradient(135deg,#f59e0b,#f97316)',padding:'14px 18px',borderRadius:'16px 16px 0 0',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
              <div style={{display:'flex',alignItems:'center',gap:'8px',color:'#fff'}}>
                <span style={{fontSize:'20px'}}>📋</span>
                <h3 style={{margin:0,fontSize:'15px',fontWeight:800}}>CI Point 지급 기준</h3>
              </div>
              <button onClick={()=>setShowCriteria(false)} style={{background:'rgba(255,255,255,.2)',border:'none',cursor:'pointer',color:'#fff',width:'28px',height:'28px',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'16px',fontWeight:700}}>×</button>
            </div>
            <div style={{padding:'12px',overflowX:'auto'}}>
              <table style={{width:'100%',borderCollapse:'collapse',fontSize:'11px',minWidth:'480px'}}>
                <thead>
                  <tr style={{background:'#1e293b'}}>
                    <th style={{padding:'8px 6px',color:'#fff',fontWeight:700,textAlign:'center',width:'30px',borderRight:'1px solid #334155'}}>No</th>
                    <th style={{padding:'8px 6px',color:'#fff',fontWeight:700,textAlign:'left',borderRight:'1px solid #334155'}}>CI 활동 분류</th>
                    <th style={{padding:'8px 6px',color:'#fff',fontWeight:700,textAlign:'left',borderRight:'1px solid #334155'}}>평가 항목</th>
                    <th style={{padding:'8px 6px',color:'#fff',fontWeight:700,textAlign:'center',width:'45px',borderRight:'1px solid #334155'}}>Before</th>
                    <th colSpan={2} style={{padding:'8px 6px',color:'#fff',fontWeight:700,textAlign:'center',borderRight:'1px solid #334155'}}>After</th>
                    <th style={{padding:'8px 6px',color:'#fff',fontWeight:700,textAlign:'center',width:'60px'}}>비고</th>
                  </tr>
                  <tr style={{background:'#334155'}}>
                    <th colSpan={4} style={{padding:'4px',borderRight:'1px solid #475569'}}/>
                    <th style={{padding:'4px 6px',color:'#fbbf24',fontSize:'10px',fontWeight:700,textAlign:'center',borderRight:'1px solid #475569',width:'50px'}}>전 직원</th>
                    <th style={{padding:'4px 6px',color:'#fbbf24',fontSize:'10px',fontWeight:700,textAlign:'center',borderRight:'1px solid #475569',width:'55px'}}>팀장/조장급</th>

                  </tr>
                </thead>
                <tbody>
                  {CI_CRITERIA.map((c,i)=>(
                    <tr key={i} style={{background:i%2===0?'#fff':'#f8fafc',borderBottom:'1px solid #e5e7eb'}}>
                      <td style={{padding:'6px',textAlign:'center',fontWeight:700,color:'#666',borderRight:'1px solid #e5e7eb'}}>{c.no}</td>
                      <td style={{padding:'6px',fontWeight:600,color:'#333',borderRight:'1px solid #e5e7eb',whiteSpace:'pre-line',lineHeight:1.3}}>{c.cat||''}</td>

            </div>
          </div>
        </div>

                </div>

              <button onClick={()=>setSelPerson(null)} style={{background:'#f3f4f6',border:'none',cursor:'pointer',width:'28px',height:'28px',borderRadius:'50%',display:'flex',alignItems:'center',justifyContent:'center',color:'#666',fontSize:'16px'}}>×</button>
            </div>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:'13px'}}>
              <thead>
                <tr style={{background:'#f8fafc'}}>
                  <th style={{textAlign:'left',padding:'8px 10px',borderBottom:'2px solid #e5e7eb',color:'#666',fontWeight:700}}>카테고리</th>
                  <th style={{textAlign:'right',padding:'8px 10px',borderBottom:'2px solid #e5e7eb',color:'#666',fontWeight:700,width:'70px'}}>점수</th>

              <tbody>
                {categories.filter(c=>c!=='교환').map((cat,ci)=>{
                  const val=selData.totals[cat]||0;
                  if(!val)return null;
                  return(
                    <tr key={cat} style={{background:ci%2===0?'#fff':'#fafafa'}}>
                      <td style={{padding:'7px 10px',borderBottom:'1px solid #f0f0f0'}}>
                        <span style={{display:'flex',alignItems:'center',gap:'6px'}}>

                {selData.exchange>0&&(
                  <tr style={{background:'#f9fafb'}}>
                    <td style={{padding:'7px 10px',borderBottom:'1px solid #f0f0f0'}}>

                        <span style={{width:'8px',height:'8px',borderRadius:'2px',background:'#94a3b8',flexShrink:0}}/>
                        교환 (차감)
                      </span>
                    </td>
                    <td style={{padding:'7px 10px',borderBottom:'1px solid #f0f0f0',textAlign:'right',fontWeight:700,color:'#64748b'}}>-{selData.exchange}</td>

              </tbody>
              <tfoot>
                <tr style={{background:'#fffbeb'}}>
                  <td style={{padding:'8px 10px',fontWeight:800,fontSize:'14px'}}>총점</td>
                  <td style={{padding:'8px 10px',textAlign:'right',fontWeight:800,fontSize:'17px',color:'#f59e0b'}}>{selData.gross}</td>
                </tr>
                {selData.exchange>0&&(
                <tr style={{background:'#f0fdf4'}}>
                  <td style={{padding:'6px 10px',fontWeight:600,fontSize:'12px',color:'#666'}}>잔여 포인트</td>

            <div style={{display:'flex',gap:'8px',marginTop:'12px'}}>
